/* ======================================================================
   EVACUATION
   ====================================================================== */
function evacHash(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))|0; } return Math.abs(h); }
function evacOverrideStatus(id, baseline){ return (ui.evacuation.overrides && ui.evacuation.overrides[id]) ? 'safe' : baseline; }
function evacFloorForDept(deptName){ const d = state.departments.find(x=>x.name===deptName); return d ? d.floor : t('evacuation.allFloors'); }
// Tower mode's checked-in visitors already carry their office's floor name directly as
// hostDept (see officeHostOptions/createVisitorCheckin — dept:f.name) — no department
// lookup needed there, unlike Employees mode where hostDept is a real department name that
// has to be resolved to a floor via evacFloorForDept.
function evacFloorForVisitor(v){ return isTowerMode() ? (v.hostDept || t('evacuation.allFloors')) : evacFloorForDept(v.hostDept); }

// Builds the live on-site roster for an active evacuation from real app state — present
// employees (attendance.status==='present') plus checked-in visitors (site-scoped, like
// everywhere else in the app). Floor comes from the person's department (employees) or
// their host's department (visitors). Baseline status is assigned by ranking the whole
// roster on a deterministic per-id hash (stable across re-renders, no Math.random()) and
// taking the lowest-ranked handful as "unaccounted" / "in progress" — proportional to
// roster size, but always at least one of each once there are a few people on-site, so a
// freshly triggered drill always has something to roll-call rather than an all-clear board
// by chance on a small office. ui.evacuation.overrides then tracks "Mark Safe" clicks.
function evacRosterComputed(){
  // Tower mode has no attendance-tracked staff of its own — offices are tenants, not managed
  // employees (see the Employees nav item being mode-gated to Employees mode) — so there's no
  // "employees" roster to roll-call there; evacuation there is entirely visitors + deliveries
  // already on-site.
  const employeesRaw = isTowerMode() ? [] : bySite(state.employees||[]).filter(e=>e.attendance && e.attendance.status==='present').map(e=>{
    const id = 'emp:'+e.id;
    const floor = evacFloorForDept(e.department);
    return { id, name: employeeFullName(e), sub: e.department+' · '+floor, floor, office:'', hash: evacHash(id) };
  });
  const visitorsRaw = [], contractorsRaw = [];
  bySite(state.visitors).filter(v=>v.status==='checked-in').forEach(v=>{
    const isContractor = v.purpose==='Contractor Work';
    const id = (isContractor?'con:':'vis:')+v.id;
    const floor = evacFloorForVisitor(v);
    // In Tower mode the visitor's host IS the office/unit they're visiting — surface it in the
    // roll-call card so responders know exactly which unit to check, not just which floor.
    const office = isTowerMode() ? (v.host||'') : '';
    const sub = isTowerMode() ? (office||'—')+' · '+floor+' · '+v.badgeCode : (v.company||'—')+' · '+floor+' · '+v.badgeCode;
    const entry = { id, name:v.name, sub, floor, office, hash: evacHash(id) };
    (isContractor ? contractorsRaw : visitorsRaw).push(entry);
  });

  const combined = [...employeesRaw, ...visitorsRaw, ...contractorsRaw];
  const n = combined.length;
  let unaccountedN = n===0 ? 0 : Math.max(1, Math.round(n*0.06));
  let inProgressN = n===0 ? 0 : Math.max(1, Math.round(n*0.10));
  unaccountedN = Math.min(unaccountedN, n);
  inProgressN = Math.min(inProgressN, Math.max(0, n-unaccountedN));
  const ranked = combined.slice().sort((a,b)=>a.hash-b.hash);
  const statusById = {};
  ranked.forEach((p,i)=>{ statusById[p.id] = i<unaccountedN ? 'unaccounted' : (i<unaccountedN+inProgressN ? 'inProgress' : 'safe'); });

  const employeesAllRaw = employeesRaw.map(p=>({ id:p.id, name:p.name, sub:p.sub, floor:p.floor, office:p.office, status: evacOverrideStatus(p.id, statusById[p.id]) }));
  const visitorsAllRaw = visitorsRaw.map(p=>({ id:p.id, name:p.name, sub:p.sub, floor:p.floor, office:p.office, status: evacOverrideStatus(p.id, statusById[p.id]) }));
  const contractorsAllRaw = contractorsRaw.map(p=>({ id:p.id, name:p.name, sub:p.sub, floor:p.floor, office:p.office, status: evacOverrideStatus(p.id, statusById[p.id]) }));

  const totals = { total:0, safe:0, inProgress:0, unaccounted:0 };
  const floorCounts = {};
  [...employeesAllRaw, ...visitorsAllRaw, ...contractorsAllRaw].forEach(p=>{
    totals.total++; totals[p.status]++;
    floorCounts[p.floor] = (floorCounts[p.floor]||0)+1;
  });

  return {
    employeesAll: employeesAllRaw.filter(p=>p.status!=='unaccounted'),
    visitorsAll: visitorsAllRaw.filter(p=>p.status!=='unaccounted'),
    contractorsAll: contractorsAllRaw.filter(p=>p.status!=='unaccounted'),
    unaccountedAll: [...employeesAllRaw, ...visitorsAllRaw, ...contractorsAllRaw].filter(p=>p.status==='unaccounted'),
    totals, floorCounts,
  };
}

// Picks readable black/white badge text for whatever custom color the admin has chosen —
// simple relative-luminance check, good enough for a UI preview (not full WCAG contrast math).
function contrastTextColor(hex){
  const c = (hex||'').replace('#','');
  if(c.length!==6) return '#ffffff';
  const r = parseInt(c.slice(0,2),16), g = parseInt(c.slice(2,4),16), b = parseInt(c.slice(4,6),16);
  if([r,g,b].some(isNaN)) return '#ffffff';
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  return lum > 0.62 ? '#1b1e24' : '#ffffff';
}
// Real badge validity end = check-in + the visit's duration (falling back to the org's default
// visit duration when a record has none) — previously this row silently just repeated the
// check-in time under an "Expires" label, which was misleading rather than actually missing.
function badgeExpiryDate(v){

  let durMin = parseInt(v.duration, 10);
  if(isNaN(durMin) || durMin<=0) durMin = parseInt(state.settings.defaultVisitDuration, 10) || 240;
  return new Date(new Date(v.checkIn).getTime() + durMin*60000);
}

/* ======================================================================
   REPORTS & ANALYTICS
   ====================================================================== */
function reportRangeDays(){ return {'today':1,'thisWeek':7,'thisMonth':30,'quarter':90,'year':365}[ui.reports.range]||30; }

// Visitors (site-scoped) whose check-in age in days falls in [offsetDays, offsetDays+days) — age 0 = today.
function reportsScopedVisitors(offsetDays, days){
  const scoped = bySite(state.visitors);
  return scoped.filter(v=>{ const age = daysDiff(new Date(), new Date(v.checkIn)); return age>=offsetDays && age<offsetDays+days; });
}
// The visitors backing the stat cards / breakdowns for whichever range is currently picked.
// The five presets keep using the existing age-in-days windowing above unchanged; 'custom'
// filters directly on the picked From/To dates instead — same open-ended-side behavior as
// Visitors' own custom range (see applyVisitorRangeFilter): an empty From means "up to To",
// an empty To means "from From onward".
function reportsCurrentVisitors(){
  if(ui.reports.range==='custom'){
    let list = bySite(state.visitors);
    if(ui.reports.customFrom) list = list.filter(v=> new Date(v.checkIn) >= new Date(ui.reports.customFrom+'T00:00:00'));
    if(ui.reports.customTo) list = list.filter(v=> new Date(v.checkIn) <= new Date(ui.reports.customTo+'T23:59:59'));
    return list;
  }
  return reportsScopedVisitors(0, reportRangeDays());
}
// The equal-length window immediately before the current one, purely to drive the stat
// cards' vs-previous-period delta badges — mirrors the offsetDays=days trick the presets
// already use (reportsScopedVisitors(days, days)), just derived from the picked dates when
// the range is custom instead of from a day count.
function reportsPreviousVisitors(){
  if(ui.reports.range==='custom'){
    if(!ui.reports.customFrom && !ui.reports.customTo) return [];
    const to = ui.reports.customTo ? new Date(ui.reports.customTo+'T23:59:59') : new Date();
    const from = ui.reports.customFrom ? new Date(ui.reports.customFrom+'T00:00:00') : new Date(0);
    const spanMs = Math.max(1, to - from);
    const prevTo = new Date(from.getTime() - 1);
    const prevFrom = new Date(prevTo.getTime() - spanMs);
    return bySite(state.visitors).filter(v=>{ const d = new Date(v.checkIn); return d>=prevFrom && d<=prevTo; });
  }
  const days = reportRangeDays();
  return reportsScopedVisitors(days, days);
}
function pctChangeStr(cur, prev){
  if(prev===0) return cur===0 ? 0 : 100;
  return Math.round(((cur-prev)/prev)*100);
}
// Loose name-match against invites — same precedent as checkBlacklistMatch(); there is no persistent
// visitor→invite link in the data model, so this is the best available heuristic for "pre-registered".
function visitorWasPreregistered(v){ return state.invites.some(inv=>inv.visitorName===v.name); }
function reportsFirstSeenMap(){
  const allSorted = state.visitors.slice().sort((a,b)=> new Date(a.checkIn)-new Date(b.checkIn));
  const firstSeen = {};
  allSorted.forEach(v=>{ if(!(v.name in firstSeen)) firstSeen[v.name] = v.checkIn; });
  return firstSeen;
}
function reportsStatsData(){
  const cur = reportsCurrentVisitors();
  const prev = reportsPreviousVisitors();
  const durCalc = (list)=>{ const w=list.filter(v=>v.checkOut); return w.length ? w.reduce((s,v)=>s+minutesBetween(v.checkIn,v.checkOut),0)/w.length : 0; };
  const waitCalc = (list)=> list.length ? list.reduce((s,v)=>s+(2+(hashStr(v.id)%14)),0)/list.length : 0;
  const firstSeen = reportsFirstSeenMap();
  const isReturning = (v)=> firstSeen[v.name] !== v.checkIn;
  const preregCount = (list)=> list.filter(visitorWasPreregistered).length;

  const totalVisitors = cur.length, totalVisitorsPrev = prev.length;
  const avgDur = durCalc(cur), avgDurPrev = durCalc(prev);
  const avgWait = waitCalc(cur), avgWaitPrev = waitCalc(prev);
  const returning = cur.filter(isReturning).length, returningPrev = prev.filter(isReturning).length;
  const preregRate = totalVisitors ? Math.round(preregCount(cur)/totalVisitors*100) : 0;
  const preregRatePrev = totalVisitorsPrev ? Math.round(preregCount(prev)/totalVisitorsPrev*100) : 0;

  return {
    totalVisitors, totalVisitorsDelta: pctChangeStr(totalVisitors, totalVisitorsPrev),
    avgDur, avgDurDelta: pctChangeStr(Math.round(avgDur), Math.round(avgDurPrev)),
    avgWait, avgWaitDelta: pctChangeStr(Math.round(avgWait), Math.round(avgWaitPrev)),
    returning, returningDelta: pctChangeStr(returning, returningPrev),
    preregRate, preregRateDelta: pctChangeStr(preregRate, preregRatePrev),
  };
}
function reportsTrafficSeries(gran){
  const scoped = bySite(state.visitors);
  const labels=[], checkins=[], checkouts=[], prereg=[];
  const dFmt = (d)=>d.toLocaleDateString(state.lang==='ar'?'ar-AE':'en-AE',{day:'numeric',month:'short'});
  if(gran==='weekly'){
    const n=8;
    for(let w=n-1; w>=0; w--){
      let ci=0,co=0,pr=0;
      for(let d=w*7; d<w*7+7; d++){ const dv=visitorsOn(scoped,d); ci+=dv.length; co+=dv.filter(v=>v.checkOut).length; pr+=dv.filter(visitorWasPreregistered).length; }
      labels.push('W'+(n-w)); checkins.push(ci); checkouts.push(co); prereg.push(pr);
    }
  } else if(gran==='monthly'){
    const n=6;
    for(let m=n-1; m>=0; m--){
      let ci=0,co=0,pr=0;
      for(let d=m*30; d<m*30+30; d++){ const dv=visitorsOn(scoped,d); ci+=dv.length; co+=dv.filter(v=>v.checkOut).length; pr+=dv.filter(visitorWasPreregistered).length; }
      const dt=new Date(); dt.setMonth(dt.getMonth()-m);
      labels.push(dt.toLocaleDateString(state.lang==='ar'?'ar-AE':'en-AE',{month:'short'})); checkins.push(ci); checkouts.push(co); prereg.push(pr);
    }
  } else { // daily
    const n=14;
    for(let i=n-1; i>=0; i--){
      const d=new Date(); d.setDate(d.getDate()-i);
      const dv = visitorsOn(scoped, i);
      labels.push(dFmt(d));
      checkins.push(dv.length);
      checkouts.push(dv.filter(v=>v.checkOut).length);
      prereg.push(dv.filter(visitorWasPreregistered).length);
    }
  }
  return {labels, checkins, checkouts, prereg};
}
const REPORTS_PURPOSE_CATEGORY = { 'Business Meeting':'meeting','Job Interview':'interview','Delivery / Courier':'delivery','Maintenance & Repairs':'maintenance','Contractor Work':'contractor','Vendor Visit':'contractor' };

function reportsTopHosts(scoped){
  // Tower mode: office names aren't unique across branches (every branch tends to have a
  // "Unit G01"), so group by office+branch rather than office name alone — otherwise two
  // unrelated offices in different towers would get merged into one row under "All
  // Branches". Each row's sub-label surfaces the tenant/floor/branch so it reads like the
  // rest of the Tower UI rather than a bare office number.
  if(isTowerMode()){
    const counts = {};
    scoped.forEach(v=>{
      const key = v.host+'|'+v.site;
      if(!counts[key]) counts[key] = { host:v.host, site:v.site, hostDept:v.hostDept, n:0 };
      counts[key].n++;
    });
    const multiBranch = state.site==='all';
    return Object.values(counts).map(c=>{
      const officeRec = officeHostOptions(c.site).find(o=>o.name===c.host);
      const tenant = officeRec && officeRec.office ? officeRec.office.tenantName : '';
      const subParts = [tenant, c.hostDept].concat(multiBranch ? [siteName(c.site)] : []).filter(Boolean);
      return { label: c.host, sub: subParts.join(' · '), value: c.n };
    }).sort((a,b)=>b.value-a.value).slice(0,5);
  }
  const counts = {};
  scoped.forEach(v=>{ counts[v.host] = (counts[v.host]||0)+1; });
  return Object.keys(counts).map(h=>({label:h, value:counts[h]})).sort((a,b)=>b.value-a.value).slice(0,5);
}
function reportsByDepartment(scoped){
  // Tower mode: hostDept is a floor name (see officeHostOptions), and floor names repeat
  // across branches ("Ground Floor" exists in every branch) — key by floor+branch so "All
  // Branches" doesn't conflate two unrelated floors, appending the branch name to the label
  // only when it's actually needed to disambiguate (a single selected branch stays plain).
  if(isTowerMode()){
    const counts = {};
    scoped.forEach(v=>{
      const floor = v.hostDept || t('reports.purpose.site');
      const key = floor+'|'+v.site;
      if(!counts[key]) counts[key] = { floor, site:v.site, n:0 };
      counts[key].n++;
    });
    const multiBranch = state.site==='all';
    return Object.values(counts).map(c=>({
      label: multiBranch ? c.floor+' · '+siteName(c.site) : c.floor,
      value: c.n, color:'var(--s'+((hashStr(c.floor+c.site)%8)+1)+')',
    })).sort((a,b)=>b.value-a.value);
  }
  const counts = {};
  scoped.forEach(v=>{ const dept = v.hostDept || t('reports.purpose.site'); counts[dept] = (counts[dept]||0)+1; });
  return Object.keys(counts).map(dep=>({ label:dep, value:counts[dep], color:'var(--s'+((hashStr(dep)%8)+1)+')' })).sort((a,b)=>b.value-a.value);
}
function reportsWeeklyTrend(){
  const scoped = bySite(state.visitors);
  const buckets=[];
  for(let w=7; w>=0; w--){
    let sum=0;
    for(let d=w*7; d<w*7+7; d++) sum += visitorsOn(scoped,d).length;
    buckets.push({label:'W'+(8-w), value:sum});
  }
  return buckets;
}
function reportsDurationByPurpose(scoped){
  const byCat = {};
  scoped.forEach(v=>{ if(!v.checkOut) return; const k=purposeCategoryKey(v.purpose); if(!byCat[k]) byCat[k]=[]; byCat[k].push(minutesBetween(v.checkIn,v.checkOut)); });
  return Object.keys(byCat).map(k=>({ label: t('reports.purpose.'+k), value: Math.round(byCat[k].reduce((s,x)=>s+x,0)/byCat[k].length), color: REPORTS_PURPOSE_COLORS[k] }))
    .sort((a,b)=>b.value-a.value);
}
function reportsTypeComparison(){
  const scoped = bySite(state.visitors);
  const firstSeen = reportsFirstSeenMap();
  const labels=[], newArr=[], returningArr=[];
  for(let w=7; w>=0; w--){
    let nw=0, ret=0;
    for(let d=w*7; d<w*7+7; d++){
      visitorsOn(scoped,d).forEach(v=>{ if(firstSeen[v.name]===v.checkIn) nw++; else ret++; });
    }
    labels.push('W'+(8-w)); newArr.push(nw); returningArr.push(ret);
  }
  return { labels, series: [
    { label:t('reports.new'), color:'var(--accent)', values:newArr },
    { label:t('reports.returningLabel'), color:'var(--s3)', values:returningArr },

}

/* ======================================================================
   EMPLOYEES (staff directory — also used as visit hosts)
   ====================================================================== */
function shiftForEmployee(emp){
  return (emp && emp.schedule) ? state.shifts.find(s=>s.name===emp.schedule) : null;
}
function timeStrToMinutes(hhmm){
  if(!hhmm) return null;
  const p = hhmm.split(':'); const h = parseInt(p[0],10), m = parseInt(p[1],10);
  if(isNaN(h)||isNaN(m)) return null;
  return h*60+m;
}
// Employee status is derived, not stored: 'leave' and 'no check-in yet' are read
// straight off the attendance record, but Late Check-in / Early Checkout / Complete
// are computed by comparing the actual check-in/check-out clock time against the
// employee's assigned shift's start/end time (if any). Works for both today's live
// attendance record and a past attendanceLog row — same {status,checkIn,checkOut} shape.
function computeAttendanceStatus(emp, att){
  att = att || {};
  if(att.status==='leave') return 'leave';
  if(!att.checkIn) return 'absent';
  const shift = shiftForEmployee(emp);
  const startMin = shift ? timeStrToMinutes(shift.startTime) : null;
  const endMin = shift ? timeStrToMinutes(shift.endTime) : null;
  const ci = new Date(att.checkIn);
  const ciMin = ci.getHours()*60+ci.getMinutes();
  const isLate = startMin!=null && ciMin>startMin;
  if(!att.checkOut) return isLate ? 'late' : 'onsite';
  const co = new Date(att.checkOut);
  const coMin = co.getHours()*60+co.getMinutes();
  const isEarly = endMin!=null && coMin<endMin;
  if(isLate) return 'late';
  if(isEarly) return 'early';
  return 'complete';
}
const ATTENDANCE_STATUS_META = {
  onsite:   ['chip-good','status.onsite','var(--good)'],
  late:     ['chip-warning','status.lateCheckin','var(--warning)'],
  early:    ['chip-serious','status.earlyCheckout','var(--serious)'],
  complete: ['chip-muted','status.complete','var(--text-muted)'],
  absent:   ['chip-muted','status.absentToday','var(--text-muted)'],
  leave:    ['chip-leave','status.onleave','var(--s7)'],
};
function attendanceChip(emp, att){
  const key = computeAttendanceStatus(emp, att);
  const m = ATTENDANCE_STATUS_META[key] || ATTENDANCE_STATUS_META.absent;
  return '<span class="chip '+m[0]+'">'+t(m[1])+'</span>';
}
// Department/shift/branch facets narrow the roster everywhere (Directory table, Attendance
// tab table, and the status-pill counts); the status pill itself is applied on top
// only where noted, so each pill can show "how many would this filter to" without
// hiding itself.
function applyDeptShiftFacets(list){
  const dept = ui.employees.deptFilter;
  if(dept && dept!=='all') list = list.filter(e=>e.department===dept);
  const shift = ui.employees.shiftFilter;
  if(shift && shift!=='all') list = list.filter(e=>e.schedule===shift);
  const branch = ui.employees.branchFilter;
  if(branch && branch!=='all') list = list.filter(e=>e.site===branch);
  return list;
}
function applyEmployeeFacetFilters(list){
  list = applyDeptShiftFacets(list);
  const f = ui.employees.filter;
  if(f && f!=='all'){ list = list.filter(e=> computeAttendanceStatus(e, e.attendance)===f); }
  return list;
}
function filteredEmployees(){
  let list = applyEmployeeFacetFilters(state.employees.slice());
  const q = (ui.employees.search||'').trim().toLowerCase();
  if(q){
    list = list.filter(e=>
      (e.firstName+' '+e.lastName).toLowerCase().includes(q) ||
      (e.email||'').toLowerCase().includes(q) ||
      (e.employeeId||'').toLowerCase().includes(q) ||
      (e.department||'').toLowerCase().includes(q) ||
      siteName(e.site).toLowerCase().includes(q));
  }
  return list;
}
const EMPLOYEE_STATUS_PILLS = [
  ['all','pillAll','var(--text-primary)'],
  ['onsite',   ATTENDANCE_STATUS_META.onsite[1],   ATTENDANCE_STATUS_META.onsite[2]],
  ['late',     ATTENDANCE_STATUS_META.late[1],     ATTENDANCE_STATUS_META.late[2]],
  ['early',    ATTENDANCE_STATUS_META.early[1],    ATTENDANCE_STATUS_META.early[2]],
  ['complete', ATTENDANCE_STATUS_META.complete[1], ATTENDANCE_STATUS_META.complete[2]],
  ['absent',   ATTENDANCE_STATUS_META.absent[1],   ATTENDANCE_STATUS_META.absent[2]],
  ['leave',    ATTENDANCE_STATUS_META.leave[1],    ATTENDANCE_STATUS_META.leave[2]],
];
function employeePillRow(){
  const facetList = applyDeptShiftFacets(state.employees.slice());
  return '<div class="pillrow">'+EMPLOYEE_STATUS_PILLS.map(p=>{

    return '<button type="button" class="statuspill'+(ui.employees.filter===p[0]?' active':'')+'" style="--pill-color:'+p[2]+';" data-action="set-employees-status-pill" data-status="'+p[0]+'">'+t(p[1])+' <b class="tabular">'+count+'</b></button>';
  }).join('')+'</div>';
}

function directoryStatusChip(emp){ return attendanceChip(emp, emp.attendance); }
function attendanceStatusChip(emp){ return attendanceChip(emp, emp.attendance); }

      '<button class="btn btn-sm" data-action="open-employee-modal" data-id="'+emp.id+'" title="'+t('sites.edit')+'">'+icon('edit')+'</button>'+

      '<button class="btn btn-sm btn-danger" data-action="delete-employee" data-id="'+emp.id+'" title="'+t('deleteLabel')+'">'+icon('trash')+'</button>'+
    '</div></td>'+

}
function renderEmployeeDirectory(){
  const list = filteredEmployees();
  const sel = ui.employees.selected||[];
  const allVisibleSelected = list.length>0 && list.every(e=>sel.includes(e.id));
  const pageSize = ui.employeesDir.pageSize==='all' ? Math.max(1, list.length) : parseInt(ui.employeesDir.pageSize,10);

function focusKioskInput(){
  setTimeout(()=>{ const el = document.getElementById('kioskScanInput'); if(el){ el.value=''; el.focus(); } }, 0);
}
function processKioskScan(rawCode){
  const code = (rawCode||'').trim().toUpperCase();
  if(!code) return;
  const emp = state.employees.find(e=> (e.checkinCode||'').toUpperCase()===code || (e.employeeId||'').toUpperCase()===code);
  if(!emp){
    ui.employees.kioskMsg = t('employees.kioskNotFound'); ui.employees.kioskMsgType = 'warn';
    render(); focusKioskInput(); return;
  }
  const full = (emp.firstName+' '+emp.lastName).trim();
  if(!emp.attendance) emp.attendance = {status:'absent',checkIn:null,checkOut:null};
  if(emp.attendance.status==='leave'){
    ui.employees.kioskMsg = full+' — '+t('status.onleave'); ui.employees.kioskMsgType = 'warn';
  } else if(emp.attendance.status==='present'){
    emp.attendance.status = 'absent'; emp.attendance.checkOut = new Date().toISOString();
    ui.employees.kioskMsg = full+' — '+t('attendance.out')+' · '+fmtTime(emp.attendance.checkOut);
    ui.employees.kioskMsgType = 'info';
    saveState();
  } else {
    emp.attendance = { status:'present', checkIn:new Date().toISOString(), checkOut:null };
    ui.employees.kioskMsg = full+' — '+t('attendance.in')+' · '+fmtTime(emp.attendance.checkIn);
    ui.employees.kioskMsgType = 'good';
    saveState();
  }
  render(); focusKioskInput();
}
function fmtHours(mins){
  if(mins==null) return '—';
  mins = Math.max(0, mins);
  const h = Math.floor(mins/60), m = Math.round(mins%60);
  return h+'h '+m+'m';
}

function exportAttendanceReportCsv(){

    if(ui.employees.reportDept && ui.employees.reportDept!=='all') list = list.filter(function(e){ return e.department===ui.employees.reportDept; });
    const headers = ['Employee ID','Name','Branch','Department','Days Present','Days Absent','Days On Leave','Total Hours','Avg Check-in'];
    const rows = list.map(function(emp){
      const sum = employeeAttendanceSummary(emp, range, ui.employees.reportFrom, ui.employees.reportTo);
      return [emp.employeeId, (emp.firstName+' '+emp.lastName).trim(), siteName(emp.site), emp.department, sum.present, sum.absent, sum.leave, fmtHours(sum.totalMins), sum.avgCheckIn];
    });
    exportCsvModal('attendance-report.csv', headers, rows);
  } else {
    const emp = state.employees.find(function(e){ return e.id===empId; });
    if(!emp) return;
    const rows = attendanceHistoryRows(emp, range, ui.employees.reportFrom, ui.employees.reportTo);
    const headers = ['Date','Check-in','Check-out','Hours','Status'];
    const csvRows = rows.map(function(r){
      const mins = r.checkIn ? minutesBetween(r.checkIn, r.checkOut||new Date()) : null;
      return [r.date, r.checkIn?fmtDateTime(r.checkIn):'', r.checkOut?fmtDateTime(r.checkOut):'', fmtHours(mins), r.status];
    });
    exportCsvModal('attendance-'+(emp.employeeId||emp.id)+'.csv', headers, csvRows);
  }
}

/* ======================================================================
   GATE PASS — Tower mode's replacement for Pre-Registration (see
   NAV_SECTIONS: 'gatepass' shows where 'invites' otherwise would). One
   pass covers either an expected VISITOR or an expected DELIVERY; saving
   it mints a QR code (via qrPlate/badgePreviewHtml, the same QR machinery
   the visitor badge and pre-registration access code already use) that
   the visitor/courier presents at the gate. "Redeeming" a pass — standing
   in for that QR actually being scanned there, since there's no real
   scanner hardware in this demo — creates the matching Visitor Log entry
   (via createVisitorCheckin, so it also fires the office notify-on-arrival
   toast) or Delivery Log entry, exactly as if staff had logged it by hand.
   ====================================================================== */
function validateGatePassDraft(d){
  const errs = {};
  if(!(d.host||'').trim()) errs.host = t('err.required');
  if(d.type==='delivery'){
    if(!(d.carrier||'').trim()) errs.carrier = t('err.required');
    if(!(d.description||'').trim()) errs.description = t('err.required');
  } else {
    if(!(d.name||'').trim()) errs.name = t('err.required');
    else if(!isMinLen(d.name, MIN_NAME_LEN)) errs.name = t('err.minLength',{n:MIN_NAME_LEN});
    if(d.email && !isValidEmail(d.email)) errs.email = t('err.email');
    if(d.phone && !isValidPhone(d.phone)) errs.phone = t('err.phone');
    if(!(d.visitDate||'').trim()) errs.visitDate = t('err.required');
  }
  return errs;
}
function gatePassFormValid(d){
  if(!(d.host||'').trim()) return false;
  return d.type==='delivery' ? !!(d.carrier||'').trim() && !!(d.description||'').trim() : !!(d.name||'').trim() && !!(d.visitDate||'').trim();
}
function openGatePassModal(){
  ui.drafts.gatePass = defaultGatePassDraft();
  ui.gatepassHost = { query:'', open:false };
  clearFormErr('gatePass');
  openModal(renderGatePassModalBody);
}
function renderGatePassModalBody(){
  const d = ui.drafts.gatePass;
  const errs = ui.formErrors.gatePass || {};

// A styled multi-select: a row of toggle chips instead of a native <select multiple> listbox.
// `options` is [value,label] pairs; `bindPath` is a data-bind-style path — 'state.…' writes
// straight to state (and saves), otherwise it writes to ui.drafts — mirroring handleBindChange
// exactly (see the 'toggle-multiselect-chip' dispatch case). `selectedArr` is the bound array.

  const sel = selectedArr || [];
  return '<div class="chipset">'+
    options.map(o=>'<button type="button" class="chip-toggle'+(sel.includes(o[0])?' active':'')+'" data-action="toggle-multiselect-chip" data-bind-path="'+esc(bindPath)+'" data-value="'+esc(o[0])+'">'+
      (sel.includes(o[0]) ? icon('check') : '')+
      '<span>'+esc(o[1])+'</span>'+
    '</button>').join('')+
  '</div>';
}

// Keeps state.users in sync with an employee's "Login to admin panel" switch (see
// renderEmployeeModalBody()): turning it on creates a linked Host-role sign-in for them (unless
// one already exists for that email, in which case it's left alone rather than overwritten),
// and turning it off removes the one this toggle created. It only ever removes an account it
// would plausibly have created itself (role 'host', not `protected`) — a real admin/manager
// account that happens to share the employee's email is never touched, so unchecking this box
// can't accidentally lock out someone's separate, more privileged login. prevEmail lets an
// edited employee whose email just changed still find the account created under the old address.
function syncEmployeeAdminAccess(emp, prevEmail){
  const email = (emp.email||'').trim().toLowerCase();
  const oldEmail = (prevEmail||'').trim().toLowerCase();
  const existing = state.users.find(u=>u.email.toLowerCase()===email || (oldEmail && u.email.toLowerCase()===oldEmail));
  if(emp.adminAccess){
    if(existing){
      existing.email = emp.email;
      existing.name = employeeFullName(emp);
    } else {
      state.users.push({
        id:'U'+String(state.users.length+1).padStart(3,'0'), name: employeeFullName(emp), email: emp.email, role:'host',
        online:false, lastLogin:null, twoFactor:false, addedDate:new Date().toISOString(), protected:false, password: DEMO_PASSWORD,
      });
      toast(t('employees.toastAdminAccessGranted',{name:employeeFullName(emp)}), 'userCog');
    }
  } else if(existing && !existing.protected && existing.role==='host'){
    state.users = state.users.filter(u=>u!==existing);
    toast(t('employees.toastAdminAccessRevoked',{name:employeeFullName(emp)}), 'userMinus');
  }
}

// Returns the attendance status recorded for `emp` on one 'YYYY-MM-DD' date, or null when
// there's no record at all for that day (e.g. a future date nothing has been marked on yet).
// Mirrors the today-vs-attendanceLog split attendanceHistoryRows() already uses.
function employeeStatusOnDate(emp, iso){
  if(iso===todayStr()) return (emp.attendance && emp.attendance.status) || 'absent';
  const entry = (emp.attendanceLog||[]).find(r=>r.date===iso);
  return entry ? entry.status : null;
}
// Marks or clears leave for `emp` on one date — the write side of the leave calendar
// (employeeLeaveModal below). Today goes through `emp.attendance` (the live kiosk/Attendance-tab
// snapshot); every other date goes through `emp.attendanceLog`, creating a new entry there if
// one doesn't exist yet (that's what lets an admin mark upcoming leave in advance, not just edit
// history). Clearing leave only ever touches a day that's currently 'leave', so selecting a day
// that's actually present/absent and hitting "Remove Leave" can never clobber real attendance.
function setEmployeeLeaveOnDate(emp, iso, markLeave){
  if(iso===todayStr()){
    if(markLeave){ emp.attendance = { status:'leave', checkIn:null, checkOut:null }; }
    else if(emp.attendance && emp.attendance.status==='leave'){ emp.attendance = { status:'absent', checkIn:null, checkOut:null }; }
    return;
  }
  if(!emp.attendanceLog) emp.attendanceLog = [];
  const entry = emp.attendanceLog.find(r=>r.date===iso);
  if(markLeave){
    if(entry){ entry.status='leave'; entry.checkIn=null; entry.checkOut=null; }
    else emp.attendanceLog.push({date:iso, status:'leave', checkIn:null, checkOut:null});
  } else if(entry && entry.status==='leave'){
    entry.status='absent'; entry.checkIn=null; entry.checkOut=null;
  }
}

// The "Mark Leave" calendar — a month grid where clicking any number of days (need not be
// contiguous) stages them, then "Mark as Leave"/"Remove Leave" applies to every staged day at
// once. Reuses the single-date picker's cell layout (buildCalendarCells/dayOfWeekLabels) but as
// a modal-embedded panel with its own multi-select + already-on-leave highlighting instead of
// the picker's single `value`.
function employeeLeaveModalBody(){
  const cal = ui.leaveCal || {};
  const emp = state.employees.find(x=>x.id===cal.empId);
  if(!emp) return '<div class="modal-body">'+emptyState('search')+'</div>';
  const full = (emp.firstName+' '+emp.lastName).trim();
  const today = new Date();
  const nav = cal.nav || { y:today.getFullYear(), m:today.getMonth() };
  const selected = cal.selected || [];
  const monthLabel = new Date(nav.y, nav.m, 1).toLocaleDateString(state.lang==='ar'?'ar-AE':'en-AE', {month:'long', year:'numeric'});
  const cells = buildCalendarCells(nav.y, nav.m);
  const todayIso = todayStr();
  const dayCells = cells.map(function(c){
    const iso = c.y+'-'+pad2(c.m+1)+'-'+pad2(c.d);
    if(c.outside) return '<div class="dp-day outside">'+c.d+'</div>';
    const cls = ['dp-day'];
    if(iso===todayIso) cls.push('today');
    if(employeeStatusOnDate(emp, iso)==='leave') cls.push('on-leave');
    if(selected.includes(iso)) cls.push('staged');
    return '<button type="button" class="'+cls.join(' ')+'" data-action="toggle-leave-day" data-date="'+iso+'">'+c.d+'</button>';
  }).join('');
  const count = selected.length;
  return ''+
    '<div class="modal-head"><h3>'+esc(t('employees.leaveCalendarTitle',{name:full}))+'</h3><button class="icon-btn" data-action="close-modal">'+icon('x')+'</button></div>'+
    '<div class="modal-body">'+
      '<p class="section-sub" style="margin-top:0;">'+esc(t('employees.leaveCalendarHint'))+'</p>'+

// Shared by the employee-detail modal's history and the Attendance Report tab: turns a
// range key ('day'|'week'|'month'|'year'|'custom') into concrete from/to bounds (inclusive).
// 'day' means "today only"; 'custom' reads the two date-input values passed in.
function attendanceRangeBounds(range, customFrom, customTo){
  const now = new Date(); now.setHours(0,0,0,0);
  let fromDate = null, toDate = null;
  if(range==='day'){ fromDate = new Date(now); toDate = new Date(now); }
  else if(range==='week'){ fromDate = new Date(now); fromDate.setDate(fromDate.getDate()-6); }
  else if(range==='month'){ fromDate = new Date(now); fromDate.setDate(fromDate.getDate()-29); }
  else if(range==='year'){ fromDate = new Date(now); fromDate.setDate(fromDate.getDate()-364); }
  else if(range==='custom'){
    if(customFrom) fromDate = new Date(customFrom+'T00:00:00');
    if(customTo) toDate = new Date(customTo+'T00:00:00');
  }
  return { fromDate, toDate };
}
function attendanceHistoryRows(emp, range, customFrom, customTo){
  const todayIso = new Date().toISOString().slice(0,10);
  const att = emp.attendance||{};
  const todayRow = { date: todayIso, status: att.status||'absent', checkIn: att.checkIn||null, checkOut: att.checkOut||null };
  const all = [todayRow].concat(emp.attendanceLog||[]);
  all.sort((a,b)=> b.date.localeCompare(a.date));
  const { fromDate, toDate } = attendanceRangeBounds(range, customFrom, customTo);
  return all.filter(r=>{
    const d = new Date(r.date+'T00:00:00');
    if(fromDate && d < fromDate) return false;
    if(toDate && d > toDate) return false;
    return true;
  });
}
// Aggregates an employee's attendanceHistoryRows() for the Attendance Report's "all
// employees" summary table and the per-employee stat tiles.
function employeeAttendanceSummary(emp, range, customFrom, customTo){
  const rows = attendanceHistoryRows(emp, range, customFrom, customTo);
  let present=0, absent=0, leave=0, totalMins=0, checkInMinsSum=0, checkInCount=0;
  rows.forEach(function(r){
    if(r.status==='present'){
      present++;
      if(r.checkIn){
        totalMins += minutesBetween(r.checkIn, r.checkOut||new Date());
        const ci = new Date(r.checkIn);
        checkInMinsSum += ci.getHours()*60+ci.getMinutes();
        checkInCount++;
      }
    } else if(r.status==='absent') absent++;
    else if(r.status==='leave') leave++;
  });
  let avgCheckIn = '—';
  if(checkInCount){
    const avgM = checkInMinsSum/checkInCount;
    const dt = new Date(); dt.setHours(Math.floor(avgM/60), Math.round(avgM%60), 0, 0);
    avgCheckIn = fmtTime(dt.toISOString());
  }
  return { rows: rows.length, present, absent, leave, totalMins, avgCheckIn };
}

const USERS_TABS = ['users','roles','matrix','activity'];
function roleById(id){ return state.roles.find(r=>r.id===id); }
// A handful of the seeded roles' and permission matrix's labels read differently in Tower
// mode — "Employees" -> "Tower Directory", "Pre-register visitors" -> "Issue gate passes",
// "own dept" -> "own floor", and so on — since Tower mode has no Employees/Pre-Registration
// modules (Tower Directory / Gate Pass replace them; see isTowerMode() usages elsewhere).
// Rather than fork the whole roles/permissionMatrix seed data per mode, each such key has a
// sibling '<key>.tower' DICT entry; this resolves to that sibling when one exists and we're
// in Tower mode, and falls back to the base key otherwise (so user-created roles/permissions,
// which carry plain name/description/label strings rather than *Key fields, are untouched).
function tm(key){
  if(isTowerMode()){
    const towerKey = key+'.tower';
    if(DICT.hasOwnProperty(towerKey)) return t(towerKey);
  }
  return t(key);
}
function roleDisplayName(role){ return role.nameKey ? tm(role.nameKey) : (role.name||''); }
function roleDisplayDesc(role){ return role.descKey ? tm(role.descKey) : (role.description||''); }
function roleTagLabel(tag){ return tag.labelKey ? tm(tag.labelKey) : (tag.label||''); }
function roleChip(roleId){
  const role = roleById(roleId);
  if(!role) return '<span class="chip chip-muted">'+esc(roleId)+'</span>';
  if(role.tint==='muted') return '<span class="chip chip-muted">'+esc(roleDisplayName(role))+'</span>';
  return '<span class="tagchip" style="background:color-mix(in srgb, var(--'+role.tint+') 16%, transparent); color:var(--'+role.tint+'); border-color:transparent;">'+esc(roleDisplayName(role))+'</span>';
}
function fmtActivityTime(iso){
  const d = new Date(iso);
  const days = daysDiff(new Date(), d);
  const timeStr = fmtTime(iso);
  if(days===0) return t('today')+', '+timeStr;
  if(days===1) return t('activity.yesterday')+', '+timeStr;
  return fmtDate(iso,{day:'numeric',month:'short',year:'numeric'})+', '+timeStr;
}

/* ======================================================================
   KIOSK BACKGROUND IMAGE — CROP
   Cropping matches the kiosk background to a target screen shape (portrait stand,
   landscape wall display, or square). Rather than a hand-rolled drag-rectangle
   overlay, the preview reuses plain CSS object-fit:cover positioned by two percentage
   sliders (like CSS object-position) plus a zoom slider that scales around that same
   anchor point — cheap to keep in sync and easy to reproduce exactly on a canvas.
   ui.crop is ephemeral (not persisted) and only exists while the crop modal is open.
   ====================================================================== */
function cropAspectRatioOptions(){
  return [
    { key:'portrait',  label:t('settings.cropPortrait'),  w:1080, h:1920, frameW:214, frameH:380 },
    { key:'landscape', label:t('settings.cropLandscape'), w:1920, h:1080, frameW:380, frameH:214 },
    { key:'square',    label:t('settings.cropSquare'),    w:1080, h:1080, frameW:300, frameH:300 },
  ];
}
function openImageCropModal(path, dataUrl){
  ui.crop = { path, src: dataUrl, aspect:'portrait', zoom:1, panX:50, panY:50 };
  openModal(renderCropModalBody);
}
function renderCropModalBody(){
  const c = ui.crop;
  if(!c) return '';
  const options = cropAspectRatioOptions();
  const opt = options.find(o=>o.key===c.aspect) || options[0];
  return ''+
  '<div class="modal-head"><h3>'+t('settings.cropTitle')+'</h3><button class="icon-btn" data-action="close-modal">'+icon('x')+'</button></div>'+
  '<div class="modal-body">'+
    '<div class="section-sub" style="margin-bottom:14px;">'+t('settings.cropSub')+'</div>'+
    '<div class="crop-aspect-btns">'+
      options.map(o=>'<button type="button" class="btn btn-sm'+(o.key===c.aspect?' btn-primary':'')+'" data-action="crop-set-aspect" data-aspect="'+o.key+'">'+esc(o.label)+'</button>').join('')+
    '</div>'+
    '<div class="crop-frame" id="cropFrame" style="width:'+opt.frameW+'px;height:'+opt.frameH+'px;">'+
      '<img id="cropImg" src="'+esc(c.src)+'" style="object-position:'+c.panX+'% '+c.panY+'%;transform-origin:'+c.panX+'% '+c.panY+'%;transform:scale('+c.zoom+');">'+
    '</div>'+
    '<div class="crop-controls">'+
      '<div class="crop-row"><label>'+t('settings.cropZoom')+'</label><input type="range" id="cropZoom" min="1" max="3" step="0.01" value="'+c.zoom+'"></div>'+
      '<div class="crop-row"><label>'+t('settings.cropPanX')+'</label><input type="range" id="cropPanX" min="0" max="100" step="1" value="'+c.panX+'"></div>'+
      '<div class="crop-row"><label>'+t('settings.cropPanY')+'</label><input type="range" id="cropPanY" min="0" max="100" step="1" value="'+c.panY+'"></div>'+
    '</div>'+
  '</div>'+
  '<div class="modal-foot">'+
    '<button type="button" class="btn" data-action="close-modal">'+t('cancel')+'</button>'+
    '<button type="button" class="btn btn-primary" data-action="crop-apply">'+icon('check')+t('settings.cropApply')+'</button>'+
  '</div>';
}
function applyImageCrop(){
  const c = ui.crop;
  if(!c) return;
  const options = cropAspectRatioOptions();
  const opt = options.find(o=>o.key===c.aspect) || options[0];
  const Wc = opt.w, Hc = opt.h;
  const img = new Image();
  img.onload = function(){
    const w = img.naturalWidth || Wc, h = img.naturalHeight || Hc;
    const coverScale = Math.max(Wc / w, Hc / h);
    const dispW0 = w * coverScale, dispH0 = h * coverScale;
    const left0 = (Wc - dispW0) * (c.panX / 100);
    const top0 = (Hc - dispH0) * (c.panY / 100);
    const px = Wc * (c.panX / 100), py = Hc * (c.panY / 100);
    const z = c.zoom || 1;
    const finalLeft = px + z * (left0 - px);
    const finalTop = py + z * (top0 - py);
    const finalW = dispW0 * z, finalH = dispH0 * z;
    const canvas = document.createElement('canvas');
    canvas.width = Wc; canvas.height = Hc;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h, finalLeft, finalTop, finalW, finalH);
    setDeep(ui.drafts, c.path, canvas.toDataURL('image/jpeg', 0.92));
    ui.crop = null;
    ui.modal = null;
    toast(t('settings.toastCropApplied'), 'check');
    render();
  };
  img.src = c.src;
}

/* ======================================================================
   SIGNATURE PAD — a real interactive drawing surface (unlike the photo/ID-scan captures
   elsewhere in this app, which are simulated/randomized since there's no actual camera or
   card-reader hardware). Drawing itself never calls render(): the canvas is a live DOM node
   drawn on directly via delegated pointer-event listeners (see the 'pointerdown'/'pointermove'
   /'pointerup' listeners near the other document-level input listeners), same reasoning as the
   crop modal's zoom/pan sliders — rebuilding the modal's innerHTML mid-stroke would fight the
   browser's own drawing. Only Clear/Save/Cancel touch render(), and Save is the one point the
   canvas is rasterized (via toDataURL, same technique as applyImageCrop() above) and persisted
   into the draft at ui.sigPad.path.
   ====================================================================== */
function openSignatureModal(path){

    '<div class="sig-pad-frame">'+

// Called right after the signature modal's HTML lands in the DOM (both on first open and on any
// later re-render while it's open) to paint a white "paper" background and restore whatever was
// already saved, so re-signing doesn't start from a blank pad unless Clear was pressed.
function initSignaturePadCanvas(){
  const canvas = document.getElementById('sigPadCanvas');
  if(!canvas || !ui.sigPad) return;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const existing = canvas.getAttribute('data-existing');
  if(existing){
    const img = new Image();
    img.onload = function(){ ctx.drawImage(img, 0, 0, canvas.width, canvas.height); };
    img.src = existing;
    ui.sigPad.empty = false;
  } else {
    ui.sigPad.empty = true;
  }
}
function clearSignaturePad(){
  const canvas = document.getElementById('sigPadCanvas');
  if(!canvas || !ui.sigPad) return;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ui.sigPad.empty = true;
}
function saveSignaturePad(){
  const s = ui.sigPad;
  const canvas = document.getElementById('sigPadCanvas');
  if(!s || !canvas) return;
  if(s.empty){ toast(t('checkin.signatureEmptyToast'), 'alert'); return; }
  setDeep(ui.drafts, s.path, canvas.toDataURL('image/png'));
  ui.sigPad = null;
  ui.modal = null;
  toast(t('checkin.signatureSavedToast'), 'check');
  render();
}

// ======================================================================
// RETURNING VISITORS — lets the Check-In form and the Quick Actions Walk-in tile look someone
// up instead of re-typing their details, and lets the Scan ID flow recognize a previously-seen
// ID number automatically. This app has no separate "visitor profile" table — a person's
// profile is derived on the fly from their own past check-ins in state.visitors, grouped by ID
// number (falling back to phone for ID-less flows like Walk-in, which never captures an ID) and
// keeping the most recently seen value for every field, plus a running visit count.
// ======================================================================
function visitorHistoryIndex(){
  const byKey = new Map();
  // Oldest-first, so the LAST write per key ends up holding that person's most recent details.
  const sorted = state.visitors.slice().sort((a,b)=> new Date(a.checkIn) - new Date(b.checkIn));
  sorted.forEach(v=>{
    const key = v.idNumber ? 'id:'+v.idNumber : (v.phone ? 'ph:'+v.phone : null);
    if(!key) return;
    const prevCount = byKey.has(key) ? byKey.get(key).visitCount : 0;
    byKey.set(key, {
      key, name:v.name, idType:v.idType, idNumber:v.idNumber, nationality:v.nationality,
      phone:v.phone, email:v.email, company:v.company, lastHost:v.host, lastPurpose:v.purpose,
      lastSite:v.site, lastVisit:v.checkIn, visitCount: prevCount+1,
    });
  });
  return Array.from(byKey.values());
}
// Free-text search across the derived history — name, phone, ID number or email. Requires at
// least 2 characters so it never dumps the entire visitor history into a results list.
function searchReturningVisitors(query){
  const q = (query||'').trim().toLowerCase();
  if(q.length<2) return [];
  return visitorHistoryIndex()
    .filter(p=> p.name.toLowerCase().includes(q) || (p.phone||'').toLowerCase().includes(q) || (p.idNumber||'').toLowerCase().includes(q) || (p.email||'').toLowerCase().includes(q))
    .sort((a,b)=> new Date(b.lastVisit) - new Date(a.lastVisit))
    .slice(0,8);
}
// Exact-match lookup by ID number — powers the Scan ID flow's silent "is this someone we've
// seen before" check right after a card is scanned.
function findReturningVisitorByIdNumber(idNumber){
  if(!idNumber) return null;
  return visitorHistoryIndex().find(p=>p.idNumber===idNumber) || null;
}

// Shared visitor-record builder used by both the full Check-In form and the
// topbar Quick Actions walk-in / invite-checkin flows, so all three stay in sync.
function createVisitorCheckin(opts){
  const hostRec = hostOptionsForMode().find(h=>h.name===opts.host);
  // Tower mode's stand-in for "notify the host on arrival" — there's no real email/SMS
  // backend anywhere in this app (see deliveries' notify-delivery-recipient for the same
  // simulated pattern), so a matched office with notifications on just gets a toast.
  if(isTowerMode() && hostRec && hostRec.office && hostRec.office.notifyOnArrival!==false){
    toast(t('tower.toastNotified',{name: hostRec.office.contactName||hostRec.office.name}), 'bell');
  }
  return {
    id: nextVisitorId(), name: opts.name, idType: opts.idType||'', idNumber: opts.idNumber||'',
    nationality: opts.nationality||'', phone: opts.phone||'', email: opts.email||'',
    company: opts.company||'', host: opts.host, hostDept: hostRec?hostRec.dept:'',
    purpose: opts.purpose||'', site: opts.site || (state.site!=='all'?state.site:state.sites[0].id),
    checkIn: new Date().toISOString(), checkOut:null, status:'checked-in',
    duration: parseInt(opts.duration,10)||60,
    badgeCode: randId('ZAP',5), watchMatch: !!checkBlacklistMatch(opts.name),
    notes: opts.notes || '',
    // Only Quick Actions' Scan ID flow ever sets this (see submitIdScanCheckin()) — every
    // other check-in path leaves it '', same convention as the other optional opts.* fields.
    idExpiryDate: opts.idExpiryDate || '',
    // Captured from the signature pad on the full Check-In form only (see the "Visitor photo"
    // aside card) — a base64 PNG data URL, or '' when the visitor wasn't asked to sign.
    signature: opts.signature || '',
  };
}

  else { setDeep(ui.drafts, path, val); clearHostIfWrongBranch(path, val); }
  render();
}
// Shared by both places a branch field can change (the plain data-bind path above, and the
// fauxSelect 'select-fauxselect' action below, which is what the Check-In/Pre-Registration
// branch dropdowns actually use) — clears a previously-picked host that no longer works at
// the newly-selected branch, so hostCombo's now-rescoped list (see employeeHostOptions) and
// the value actually sitting in the field never drift apart.
function clearHostIfWrongBranch(path, val){
  if(path!=='checkin.site' && path!=='invite.site') return;
  const group = path.split('.')[0];
  const host = ui.drafts[group].host;
  if(host && !hostOptionsForMode(val).some(h=>h.name===host)) ui.drafts[group].host = '';
}

// chip click — which itself never focuses the field — knows where to insert. Only these two
// fields ever set an id of this shape, so no extra scoping is needed.
document.addEventListener('focusin', function(e){
  if(e.target && e.target.id==='msgtpl-subject') ui.msgTemplateActiveField = 'subject';

});

      const count = state.employees.filter(e=>e.schedule===sh.name).length;
      if(count>0){ toast(t('employees.deleteShiftBlocked',{n:count}), 'shieldAlert'); break; }
      confirmModal(esc(sh.name)+' — '+t('confirmRemove'), 'do-delete-shift', id);
      break;
    }
    case 'do-delete-shift': {
      state.shifts = state.shifts.filter(x=>x.id!==id);
      saveState(); closeModal(); toast(t('toastRemoved')); render();
      break;
    }
    case 'open-msgtemplate-modal': openMsgTemplateModal(id||null); break;
    case 'insert-msgtemplate-placeholder': {
      const value = el.getAttribute('data-value')||'';
      // Subject only exists for email templates — if the tracked field is 'subject' but the
      // form is currently SMS (no subject field rendered), fall back to Body.
      let fieldName = (ui.msgTemplateActiveField==='subject' && ui.drafts.msgTemplate.channel==='email') ? 'subject' : 'body';
      const fieldId = fieldName==='subject' ? 'msgtpl-subject' : 'msgtpl-body';
      const node = document.getElementById(fieldId);
      const current = ui.drafts.msgTemplate[fieldName] || '';
      let start = current.length, end = current.length;
      if(node && typeof node.selectionStart==='number'){ start = node.selectionStart; end = node.selectionEnd; }
      ui.drafts.msgTemplate[fieldName] = current.slice(0,start) + value + current.slice(end);
      const caretPos = start + value.length;
      render();
      const freshNode = document.getElementById(fieldId);
      if(freshNode){
        freshNode.focus();
        if(typeof freshNode.setSelectionRange==='function') freshNode.setSelectionRange(caretPos, caretPos);
      }
      break;
    }
    case 'toggle-msgtemplate-active': {
      const tpl = state.messageTemplates.find(x=>x.id===id);
      if(tpl){ tpl.active = !tpl.active; saveState(); render(); }
      break;
    }
    case 'delete-msgtemplate': {
      const tpl = state.messageTemplates.find(x=>x.id===id);
      if(!tpl) break;
      confirmModal(esc(tpl.name)+' — '+t('notif.deleteTemplateConfirm'), 'do-delete-msgtemplate', id);
      break;
    }
    case 'do-delete-msgtemplate': {
      state.messageTemplates = state.messageTemplates.filter(x=>x.id!==id);
      saveState(); closeModal(); toast(t('notif.toastTemplateDeleted')); render();
      break;
    }
    case 'toggle-multiselect-chip': {
      const path = el.getAttribute('data-bind-path');
      const value = el.getAttribute('data-value');
      const isState = path.indexOf('state.')===0;
      const root = isState ? state : ui.drafts;
      const key = isState ? path.slice(6) : path;
      const current = getDeep(root, key) || [];
      const next = current.includes(value) ? current.filter(x=>x!==value) : current.concat([value]);
      setDeep(root, key, next);
      if(isState) saveState();
      render();
      break;
    }
    case 'add-purpose-option-chip': {
      const val = (ui.drafts.purposeOptionsNewText||'').trim();
      if(!Array.isArray(ui.drafts.purposeOptionsList)) ui.drafts.purposeOptionsList = state.purposes.map(p=>p.name);
      if(val && !ui.drafts.purposeOptionsList.some(n=>n.toLowerCase()===val.toLowerCase())){
        ui.drafts.purposeOptionsList.push(val);
      }
      ui.drafts.purposeOptionsNewText = '';
      render();
      break;
    }
    case 'remove-purpose-option-chip': {
      const idx = parseInt(el.getAttribute('data-index'),10);
      if(Array.isArray(ui.drafts.purposeOptionsList) && !isNaN(idx)) ui.drafts.purposeOptionsList.splice(idx,1);
      render();
      break;
    }
    case 'manage-shift-employees': openShiftAssignModal(id); break;
    case 'toggle-assign-employee': {
      const sel = ui.employees.assignSelected || (ui.employees.assignSelected=[]);
      const idx = sel.indexOf(id);
      if(idx>-1) sel.splice(idx,1); else sel.push(id);
      render(); break;
    }
    case 'assign-select-all': {
      const visible = assignModalFilteredEmployees().map(e=>e.id);
      const sel = ui.employees.assignSelected || (ui.employees.assignSelected=[]);
      ui.employees.assignSelected = Array.from(new Set(sel.concat(visible)));
      render(); break;
    }
    case 'assign-select-none': {
      const visible = assignModalFilteredEmployees().map(e=>e.id);
      const sel = ui.employees.assignSelected||[];
      ui.employees.assignSelected = sel.filter(x=>!visible.includes(x));
      render(); break;
    }
    case 'save-shift-assignment': {
      const shift = state.shifts.find(x=>x.id===ui.employees.assignShiftId);
      if(shift){
        const sel = ui.employees.assignSelected||[];
        state.employees.forEach(e=>{
          if(sel.includes(e.id)) e.schedule = shift.name;
          else if(e.schedule===shift.name) e.schedule = '';
        });
        saveState();
      }
      closeModal(); toast(t('toastShiftAssigned')); render();
      break;
    }
    case 'open-user-modal': openUserModal(); break;
    case 'copy-csv': copyCsv(); break;
    case 'download-csv-file': downloadCsvFile(); break;
    case 'download-xlsx-file': downloadXlsxFile(); break;
    case 'set-agreements-tab': {
      const tabKey = el.getAttribute('data-tab');
      ui.agreements.tab = tabKey;
      ui.agreements.menuOpenId = '';
      if(tabKey==='editor' && !ui.drafts.template){
        ui.drafts.template = defaultTemplateDraft(ui.agreements.editingId ? state.agreementTemplates.find(x=>x.id===ui.agreements.editingId) : null);
      }
      render(); break;
    }
    case 'new-template': { ui.agreements.editingId=''; ui.drafts.template = defaultTemplateDraft(null); ui.agreements.tab='editor'; render(); break; }
    case 'edit-template': {
      const tpl = state.agreementTemplates.find(x=>x.id===id);
      ui.agreements.editingId = id; ui.drafts.template = defaultTemplateDraft(tpl); ui.agreements.tab='editor'; ui.agreements.menuOpenId='';
      render(); break;
    }
    case 'toggle-template-menu': { ui.agreements.menuOpenId = ui.agreements.menuOpenId===id ? '' : id; render(); break; }
    case 'toggle-template-status': {
      const tpl = state.agreementTemplates.find(x=>x.id===id);
      if(tpl){ tpl.status = tpl.status==='active' ? 'draft' : 'active'; tpl.lastUpdated = new Date().toISOString(); saveState(); }
      ui.agreements.menuOpenId=''; render(); break;
    }
    case 'duplicate-template': {
      const tpl = state.agreementTemplates.find(x=>x.id===id);
      if(tpl){
        const copy = JSON.parse(JSON.stringify(tpl));
        copy.id = 'tpl'+Date.now();
        copy.name = tpl.name+' (Copy)';
        copy.status = 'draft';
        copy.signedCount = 0;
        copy.lastUpdated = new Date().toISOString();
        state.agreementTemplates.push(copy);
        saveState(); toast(t('agreements.toastDuplicated'),'copy'); render();
      }
      break;
    }
    case 'delete-template': {
      const tpl = state.agreementTemplates.find(x=>x.id===id);
      ui.agreements.menuOpenId='';
      if(!tpl) break;
      confirmModal(esc(tpl.name)+' — '+t('confirmRemove'), 'do-delete-template', id);
      break;
    }
    case 'do-delete-template': {
      state.agreementTemplates = state.agreementTemplates.filter(x=>x.id!==id);
      saveState(); closeModal(); toast(t('toastRemoved')); render();
      break;
    }
    case 'add-template-section': {
      const d = ui.drafts.template;
      d.sections.push({ id:'sec'+Date.now()+Math.floor(Math.random()*1000), title:'Section '+(d.sections.length+1)+': New Section', content:'' });
      render(); break;
    }
    case 'remove-template-section': {
      const idx = parseInt(el.getAttribute('data-idx'),10);
      ui.drafts.template.sections.splice(idx,1);
      render(); break;
    }
    case 'add-template-checkbox': {
      ui.drafts.template.checkboxes.push({ id:'cb'+Date.now()+Math.floor(Math.random()*1000), text:'' });
      render(); break;
    }
    case 'remove-template-checkbox': {
      const idx = parseInt(el.getAttribute('data-idx'),10);
      ui.drafts.template.checkboxes.splice(idx,1);
      render(); break;
    }
    case 'preview-template': previewTemplateModal(); break;
    case 'expand-template-preview': previewTemplateModal(); break;
    case 'save-template-draft': {
      const d = ui.drafts.template;
      const name = (d.name||'').trim();
      if(!name) break;
      const built = buildTemplateFromDraft(d, 'draft');
      if(ui.agreements.editingId){
        const tpl = state.agreementTemplates.find(x=>x.id===ui.agreements.editingId);
        if(tpl) Object.assign(tpl, built, {signedCount: tpl.signedCount});
      } else {
        state.agreementTemplates.push(Object.assign({ id:'tpl'+Date.now(), signedCount:0 }, built));
      }
      saveState();
      ui.agreements.tab='templates'; ui.agreements.editingId=''; ui.drafts.template=null;
      toast(t('agreements.toastDraftSaved'),'save'); render();
      break;
    }
    case 'export-signed-agreements': exportSignedAgreementsCsv(); break;
    case 'view-signed-agreement': viewSignedAgreementModal(id); break;
    case 'download-signed-agreement': toast('This is a demo workspace — downloading files is not wired up.','info'); break;
  }
  } catch(err){
    console.error('Click action "'+action+'" failed:', err);
    toast(t('toastFormError'), 'shieldAlert');
  }
});

document.addEventListener('submit', function(e){
  const form = e.target;
  if(!form || !form.id) return;
  e.preventDefault();

  // Defense in depth: this dispatcher covers ~20 different forms in one big if/else-if
  // chain, and previously had no error boundary — an uncaught exception partway through any
  // one branch (e.g. a stale/malformed record hit while checking for a duplicate name) would
  // silently abort the whole handler, so saveState()/closeModal()/render() never ran and the
  // Save button looked like it did nothing. Catch here so a bug in one form can't wedge the
  // whole modal with zero feedback.
  try{

  if(form.id==='loginEmailForm'){
    const email = (ui.drafts.auth.email||'').trim();
    const password = ui.drafts.auth.password||'';
    if(!isValidEmail(email)){ ui.authError = t('auth.errEmail'); ui.authErrorField = 'email'; render(); return; }
    const match = state.users.find(u=>u.email.toLowerCase()===email.toLowerCase());
    if(!match){ ui.authError = t('auth.errNoAccount'); ui.authErrorField = 'email'; render(); return; }
    if(!password){ ui.authError = t('auth.errPassword'); ui.authErrorField = 'password'; render(); return; }
    if(password!==(match.password||DEMO_PASSWORD)){ ui.authError = t('auth.errPasswordWrong'); ui.authErrorField = 'password'; render(); return; }
    ui.drafts.auth.email = email;
    ui.authError = '';
    ui.authErrorField = '';
    ui.authGenCode = genOtpCode();
    ui.drafts.auth.code = '';
    ui.authStep = 'code';
    toast(t('auth.toastSent'),'mail');
    render();
  }
  else if(form.id==='loginCodeForm'){
    const code = (ui.drafts.auth.code||'').trim();
    if(!code || code.length!==6){ ui.authError = t('auth.errCode'); ui.authErrorField = 'code'; render(); return; }
    if(code!==ui.authGenCode){ ui.authError = t('auth.errCodeWrong'); ui.authErrorField = 'code'; render(); return; }
    const match = state.users.find(u=>u.email.toLowerCase()===(ui.drafts.auth.email||'').toLowerCase());
    if(!match){ ui.authError = t('auth.errNoAccount'); ui.authErrorField = 'email'; ui.authStep = 'email'; render(); return; }
    state.session = { loggedIn:true, userId: match.id };
    match.online = true;
    match.lastLogin = new Date().toISOString();
    saveState();
    resetAuthFlow();
    ui.view = 'dashboard';
    toast(t('auth.toastWelcome',{name:match.name}),'checkCircle');
    render();
  }
  else if(form.id==='forgotEmailForm'){
    const email = (ui.drafts.auth.email||'').trim();
    if(!isValidEmail(email)){ ui.authError = t('auth.errEmail'); ui.authErrorField = 'email'; render(); return; }
    const match = state.users.find(u=>u.email.toLowerCase()===email.toLowerCase());
    if(!match){ ui.authError = t('auth.errNoAccount'); ui.authErrorField = 'email'; render(); return; }
    ui.drafts.auth.email = email;
    ui.authError = '';
    ui.authErrorField = '';
    ui.authGenCode = genOtpCode();
    ui.drafts.auth.code = '';
    ui.authStep = 'forgotCode';
    toast(t('auth.toastResetCodeSent'),'mail');
    render();
  }
  else if(form.id==='forgotCodeForm'){
    const code = (ui.drafts.auth.code||'').trim();
    if(!code || code.length!==6){ ui.authError = t('auth.errCode'); ui.authErrorField = 'code'; render(); return; }
    if(code!==ui.authGenCode){ ui.authError = t('auth.errCodeWrong'); ui.authErrorField = 'code'; render(); return; }
    const match = state.users.find(u=>u.email.toLowerCase()===(ui.drafts.auth.email||'').toLowerCase());
    if(!match){ ui.authError = t('auth.errNoAccount'); ui.authErrorField = 'email'; ui.authStep = 'forgotEmail'; render(); return; }
    ui.authError = '';
    ui.authErrorField = '';
    ui.drafts.auth.newPassword = '';
    ui.drafts.auth.confirmPassword = '';
    ui.authStep = 'forgotReset';
    render();
  }
  else if(form.id==='forgotResetForm'){
    const newPassword = ui.drafts.auth.newPassword||'';
    const confirmPassword = ui.drafts.auth.confirmPassword||'';
    if(newPassword.length < 6){ ui.authError = t('auth.errPasswordTooShort'); ui.authErrorField = 'newPassword'; render(); return; }
    if(!confirmPassword){ ui.authError = t('auth.errConfirmPassword'); ui.authErrorField = 'confirmPassword'; render(); return; }
    if(newPassword!==confirmPassword){ ui.authError = t('auth.errPasswordMismatch'); ui.authErrorField = 'confirmPassword'; render(); return; }
    const match = state.users.find(u=>u.email.toLowerCase()===(ui.drafts.auth.email||'').toLowerCase());
    if(!match){ ui.authError = t('auth.errNoAccount'); ui.authErrorField = 'email'; ui.authStep = 'forgotEmail'; render(); return; }
    match.password = newPassword;
    saveState();
    const email = ui.drafts.auth.email;
    resetAuthFlow();
    ui.drafts.auth.email = email;
    toast(t('auth.toastPasswordReset'),'checkCircle');
    render();
  }
  else if(form.id==='checkinForm'){
    const d = ui.drafts.checkin;
    if(!d.ack) return;
    const ciErrs = validateCheckinDraft(d);
    if(Object.keys(ciErrs).length){ ui.formErrors.checkin = ciErrs; toast(t('toastValidationError'),'shieldAlert'); render(); return; }
    clearFormErr('checkin');
    const rec = createVisitorCheckin({
      name:d.name, idType:d.idType, idNumber:d.idNumber, nationality:d.nationality,
      phone: d.phone ? '+'+(d.phoneCode||'971')+' '+d.phone : '', email:d.email, company:d.company, host:d.host,
      purpose:d.purpose, site:d.site, duration:d.duration, signature:d.signature,
    });
    state.visitors.unshift(rec);
    saveState();
    const keepSite = d.site;
    ui.drafts.checkin = defaultCheckinDraft(); ui.drafts.checkin.site = keepSite;
    ui.checkinNat = {query:'', open:false};
    ui.checkinHost = {query:'', open:false};
    render();
    badgeModal(rec);
  }
  else if(form.id==='quickWalkinForm'){
    const d = ui.drafts.quickAction;
    if(!d.name || !d.host) return;
    const rec = createVisitorCheckin({ name:d.name, phone:d.phone, host:d.host, purpose:d.purpose, notes:d.notes });
    state.visitors.unshift(rec);
    saveState();
    ui.quickActions.open = false;
    ui.drafts.quickAction = defaultQuickActionDraft();
    render();
    badgeModal(rec);
  }
  else if(form.id==='idScanDetailsForm'){
    submitIdScanCheckin();
  }
  else if(form.id==='inviteForm'){
    const d = ui.drafts.invite;
    const invErrs = validateInviteDraft(d);
    if(Object.keys(invErrs).length){ ui.formErrors.invite = invErrs; toast(t('toastValidationError'),'shieldAlert'); render(); return; }
    clearFormErr('invite');
    const built = buildInviteFromDraft(d, 'pending');
    let newInviteId = ui.invites.editId;
    if(ui.invites.editId){
      const inv = state.invites.find(x=>x.id===ui.invites.editId);
      if(inv) Object.assign(inv, built);
    } else {
      newInviteId = 'I'+String(state.invites.length+1).padStart(3,'0');
      state.invites.push(Object.assign({ id:newInviteId, inviteCode: randId('ZAP',4) }, built));
    }
    // If this pre-registration was created from a synced calendar meeting, mark that meeting
    // as fulfilled so it drops off the "Synced from Outlook Calendar" list — the write-back
    // half of the sync (see openInvitePanelFromCalendarEvent()).
    if(ui.drafts.calendarSourceEventId){
      const srcEvent = (state.calendarEvents||[]).find(x=>x.id===ui.drafts.calendarSourceEventId);
      if(srcEvent){ srcEvent.imported = true; srcEvent.inviteId = newInviteId; }
      ui.drafts.calendarSourceEventId = '';
    }
    saveState(); closeInvitePanel(); toast(t('toastInviteCreated'),'calendar'); render();
  }
  else if(form.id==='blacklistForm'){
    const d = ui.drafts.blacklist;
    const blErrs = validateBlacklistDraft(d);
    if(Object.keys(blErrs).length){ ui.formErrors.blacklist = blErrs; toast(t('toastValidationError'),'shieldAlert'); render(); return; }
    clearFormErr('blacklist');
    state.blacklist.push({ id:'B'+String(state.blacklist.length+1).padStart(3,'0'), name:d.name, idNumber:d.idNumber,
      nationality: d.nationality || '—', reason:d.reason, severity:d.severity, flaggedBy: (state.users[0]&&state.users[0].name)||'Admin',
      dateFlagged:new Date().toISOString() });
    saveState(); closeModal(); toast(t('toastFlagged'),'shieldAlert'); render();
  }
  else if(form.id==='siteForm'){
    const d = ui.drafts.site;
    const siteErrs = validateSiteDraft(d);
    if(Object.keys(siteErrs).length){ ui.formErrors.site = siteErrs; toast(t('toastValidationError'),'shieldAlert'); render(); return; }
    clearFormErr('site');
    const editingId = form.getAttribute('data-editing');
    if(editingId){ const s = state.sites.find(x=>x.id===editingId); if(s) Object.assign(s, d, {id:s.id}); }
    else { const id = (d.name.toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,5)||'site')+state.sites.length; state.sites.push(Object.assign({}, d, {id})); }
    saveState(); closeModal(); toast(t('toastSiteSaved')); render();
  }
  else if(form.id==='departmentForm'){
    const d = ui.drafts.department;
    const name = (d.name||'').trim();
    const deptErrs = validateDepartmentDraft(d);
    if(Object.keys(deptErrs).length){ ui.formErrors.department = deptErrs; toast(t('toastValidationError'),'shieldAlert'); render(); return; }
    clearFormErr('department');
    const editingId = form.getAttribute('data-editing');
    const dup = state.departments.find(x=>(x.name||"").toLowerCase()===name.toLowerCase() && x.id!==editingId);
    if(dup){ toast(t('toastDuplicateName'),'shieldAlert'); return; }
    if(editingId){
      const dept = state.departments.find(x=>x.id===editingId);
      if(dept){
        if(dept.name!==name){
          const oldName = dept.name;
          state.employees.forEach(e=>{ if(e.department===oldName) e.department = name; });
        }
        Object.assign(dept, d, {id:dept.id, name});
      }
    } else {
      state.departments.push(Object.assign({}, d, { id:'dept'+Date.now(), name }));
    }
    saveState(); closeModal(); toast(t('toastDepartmentSaved')); render();
  }
  else if(form.id==='purposeForm'){
    const d = ui.drafts.purpose;
    const name = (d.name||'').trim();
    const purposeErrs = validateNameOnlyDraft(d);
    if(Object.keys(purposeErrs).length){ ui.formErrors.purpose = purposeErrs; toast(t('toastValidationError'),'shieldAlert'); render(); return; }
    clearFormErr('purpose');
    const editingId = form.getAttribute('data-editing');
    const dup = state.purposes.find(x=>(x.name||"").toLowerCase()===name.toLowerCase() && x.id!==editingId);
    if(dup){ toast(t('toastDuplicateName'),'shieldAlert'); return; }
    if(editingId){
      const p = state.purposes.find(x=>x.id===editingId);
      if(p){
        if(p.name!==name){
          const oldName = p.name;
          state.visitors.forEach(v=>{ if(v.purpose===oldName) v.purpose = name; });
        }
        p.name = name;
      }
    } else {
      state.purposes.push({ id:'purpose'+Date.now(), name });
    }
    saveState(); closeModal(); toast(t('settings.toastPurposeSaved')); render();
  }
  else if(form.id==='meetingRoomForm'){
    const d = ui.drafts.meetingRoom;
    const name = (d.name||'').trim();
    const roomErrs = validateNameOnlyDraft(d);
    if(Object.keys(roomErrs).length){ ui.formErrors.meetingRoom = roomErrs; toast(t('toastValidationError'),'shieldAlert'); render(); return; }
    clearFormErr('meetingRoom');
    const editingId = form.getAttribute('data-editing');
    const dup = state.meetingRooms.find(x=>(x.name||"").toLowerCase()===name.toLowerCase() && x.id!==editingId) || (name.toLowerCase()===t('invites.noPreference').toLowerCase() || name.toLowerCase()==='no preference');
    if(dup){ toast(t('toastDuplicateName'),'shieldAlert'); return; }
    const capacity = parseInt(d.capacity,10)||6;
    if(editingId){
      const r = state.meetingRooms.find(x=>x.id===editingId);
      if(r){
        if(r.name!==name){
          const oldName = r.name;
          state.invites.forEach(i=>{ if(i.meetingRoom===oldName) i.meetingRoom = name; });
        }
        r.name = name; r.capacity = capacity; r.site = d.site;
      }
    } else {
      state.meetingRooms.push({ id:'room'+Date.now(), name, capacity, site: d.site });
    }
    saveState(); closeModal(); toast(t('settings.toastMeetingRoomSaved')); render();
  }
  else if(form.id==='idTypeForm'){
    const d = ui.drafts.idType;
    const name = (d.name||'').trim();
    const idTypeErrs = validateNameOnlyDraft(d);
    if(Object.keys(idTypeErrs).length){ ui.formErrors.idType = idTypeErrs; toast(t('toastValidationError'),'shieldAlert'); render(); return; }
    clearFormErr('idType');
    const editingId = form.getAttribute('data-editing');
    const dup = state.idTypes.find(x=>(x.name||"").toLowerCase()===name.toLowerCase() && x.id!==editingId);
    if(dup){ toast(t('toastDuplicateName'),'shieldAlert'); return; }
    if(editingId){
      const it = state.idTypes.find(x=>x.id===editingId);
      if(it){
        if(it.name!==name){
          const oldName = it.name;
          state.visitors.forEach(v=>{ if(v.idType===oldName) v.idType = name; });
        }
        it.name = name;
        it.active = !!d.active;
      }
    } else {
      state.idTypes.push({ id:'idtype'+Date.now(), name, active: !!d.active });
    }
    saveState(); closeModal(); toast(t('settings.toastIdTypeSaved')); render();
  }
  else if(form.id==='visitorTypeForm'){
    const d = ui.drafts.visitorType;
    const name = (d.name||'').trim();
    const visitorTypeErrs = validateNameOnlyDraft(d);
    if(Object.keys(visitorTypeErrs).length){ ui.formErrors.visitorType = visitorTypeErrs; toast(t('toastValidationError'),'shieldAlert'); render(); return; }
    clearFormErr('visitorType');
    const editingId = form.getAttribute('data-editing');
    const dup = state.visitorTypes.find(x=>(x.name||"").toLowerCase()===name.toLowerCase() && x.id!==editingId);
    if(dup){ toast(t('toastDuplicateName'),'shieldAlert'); return; }
    if(editingId){
      const vt = state.visitorTypes.find(x=>x.id===editingId);
      if(vt){
        if(vt.name!==name){
          const oldName = vt.name;

    clearFormErr('floor');

    const dup = state.floors.find(x=>x.siteId===siteId && (x.name||"").toLowerCase()===name.toLowerCase() && x.id!==editingId);

document.addEventListener('change', function(e){
  const el = e.target;
  if(!el.getAttribute) return;
  // See the matching guard in the 'input' listener below for why the login screen's
  // email/password/code fields skip the usual render-on-every-change rebuild.
  if(AUTH_FAST_INPUT_IDS.includes(el.id)){ setDeep(ui.drafts, el.getAttribute('data-bind'), el.value); return; }
  if(el.tagName==='INPUT' && el.type==='file' && el.hasAttribute('data-bind-file')){
    const path = el.getAttribute('data-bind-file');
    const wantsCrop = el.hasAttribute('data-crop');
    const file = el.files && el.files[0];
    if(file){
      const reader = new FileReader();
      reader.onload = function(){
        if(wantsCrop){ openImageCropModal(path, reader.result); }
        else { setDeep(ui.drafts, path, reader.result); render(); }
      };
      reader.readAsDataURL(file);
    }
    return;
  }
  if(el.tagName==='INPUT' && el.type==='file' && el.hasAttribute('data-csv-import')){
    const kind = el.getAttribute('data-csv-import');
    const file = el.files && el.files[0];
    if(file && ui.csvImport){
      const reader = new FileReader();
      reader.onload = function(){
        const { records } = csvTextToRecords(String(reader.result||''));
        const result = kind==='employees' ? processEmployeeCsvRecords(records) : processInviteCsvRecords(records);
        ui.csvImport.fileName = file.name;
        ui.csvImport.valid = result.valid;
        ui.csvImport.errors = result.errors;
        render();
      };
      reader.readAsText(file);
    }
    return;
  }
  if(el.tagName==='SELECT' && el.multiple && el.hasAttribute('data-bind')){
    const path = el.getAttribute('data-bind');
    const vals = Array.from(el.selectedOptions).map(o=>o.value);
    if(path.indexOf('state.')===0){ setDeep(state, path.slice(6), vals); saveState(); } else { setDeep(ui.drafts, path, vals); }
    render();
    return;
  }
  if(el.hasAttribute('data-bind')) { handleBindChange(el); return; }
  if(el.hasAttribute('data-filter-view')) { handleFilterChange(el); return; }
  if(el.getAttribute('data-action')==='set-global-site'){ state.site = el.value; saveState(); render(); return; }
});
