/* ---- Minimal self-contained XLSX writer (no external libraries) ----
   Builds a real Office Open XML workbook: a hand-rolled ZIP (store /
   no compression, so only CRC32 is needed — no deflate implementation)
   containing the small set of OOXML parts a single-sheet workbook needs.
   Cells are written as inline strings/numbers, so no sharedStrings part
   is required either. */
const CRC32_TABLE = (function(){
  const t = new Uint32Array(256);
  for(let n=0;n<256;n++){
    let c = n;
    for(let k=0;k<8;k++){ c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); }
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++){ c = CRC32_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); }
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function strToBytes(str){ return new TextEncoder().encode(str); }
function u16(n){ return [n & 0xFF, (n>>>8) & 0xFF]; }
function u32(n){ return [n & 0xFF, (n>>>8) & 0xFF, (n>>>16) & 0xFF, (n>>>24) & 0xFF]; }
function buildZip(files){
  // files: [{name, data: Uint8Array}]
  const localParts = [];
  const centralParts = [];
  let offset = 0;
  const dosTime = 0, dosDate = 0x21; // fixed placeholder timestamp
  files.forEach(f=>{
    const nameBytes = strToBytes(f.name);
    const data = f.data;
    const crc = crc32(data);
    const size = data.length;
    const localHeader = new Uint8Array([
      0x50,0x4b,0x03,0x04, 20,0, 0,0, 0,0,
      ...u16(dosTime), ...u16(dosDate),
      ...u32(crc), ...u32(size), ...u32(size),
      ...u16(nameBytes.length), ...u16(0)
    ]);
    localParts.push(localHeader, nameBytes, data);
    const centralHeader = new Uint8Array([
      0x50,0x4b,0x01,0x02, 20,0, 20,0, 0,0, 0,0,
      ...u16(dosTime), ...u16(dosDate),
      ...u32(crc), ...u32(size), ...u32(size),
      ...u16(nameBytes.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
      ...u32(0), ...u32(offset)
    ]);
    centralParts.push(centralHeader, nameBytes);
    offset += localHeader.length + nameBytes.length + data.length;
  });
  const centralStart = offset;
  let centralSize = 0;
  centralParts.forEach(p=>centralSize+=p.length);
  const eocd = new Uint8Array([
    0x50,0x4b,0x05,0x06, 0,0, 0,0,
    ...u16(files.length), ...u16(files.length),
    ...u32(centralSize), ...u32(centralStart),
    ...u16(0)
  ]);
  return new Blob([...localParts, ...centralParts, eocd], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function xmlEscape(v){
  return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function colLetter(n){
  let s=''; n++;
  while(n>0){ const r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26); }
  return s;
}
function buildXlsxSheetXml(headers, rows){
  const allRows = [headers].concat(rows);
  let xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<sheetData>';
  allRows.forEach((r, ri)=>{
    xml += '<row r="'+(ri+1)+'">';
    r.forEach((cell, ci)=>{
      const ref = colLetter(ci)+(ri+1);
      const isNum = typeof cell === 'number' && isFinite(cell);
      if(isNum){
        xml += '<c r="'+ref+'"><v>'+cell+'</v></c>';
      } else {
        xml += '<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEscape(cell)+'</t></is></c>';
      }
    });
    xml += '</row>';
  });
  xml += '</sheetData></worksheet>';
  return xml;
}
function buildXlsxBlob(headers, rows){
  const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
    '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'+
    '</Types>';
  const rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'+
    '</Relationships>';
  const workbook = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+
    '<sheets><sheet name="Sheet1" sheetId="1" r:id="rId1"/></sheets>'+
    '</workbook>';
  const workbookRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'+
    '</Relationships>';
  const sheet1 = buildXlsxSheetXml(headers, rows);
  const files = [
    { name:'[Content_Types].xml', data: strToBytes(contentTypes) },
    { name:'_rels/.rels', data: strToBytes(rootRels) },
    { name:'xl/workbook.xml', data: strToBytes(workbook) },
    { name:'xl/_rels/workbook.xml.rels', data: strToBytes(workbookRels) },
    { name:'xl/worksheets/sheet1.xml', data: strToBytes(sheet1) },
  ];
  return buildZip(files);
}
function downloadXlsxFile(){
  if(!_lastExport) return;
  const xlsxName = _lastExport.filename.replace(/\.csv$/i, '') + '.xlsx';
  const blob = buildXlsxBlob(_lastExport.headers, _lastExport.rows);
  const ok = downloadBlob(blob, xlsxName);
  toast(ok ? t('toastFileDownloaded') : t('toastDownloadFailed'), ok?'download':'info');
}

function QRCodeModel(typeNumber, errorCorrectLevel) {

}

  addData: function (data) { this.dataList.push(new QR8bitByte(data)); this.dataCache = null; },
  isDark: function (row, col) {
    if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) throw new Error(row + ',' + col);
    return this.modules[row][col];
  },
  getModuleCount: function () { return this.moduleCount; },
  make: function () { this.makeImpl(false, this.getBestMaskPattern()); },
  makeImpl: function (test, maskPattern) {
    this.moduleCount = this.typeNumber * 4 + 17;

    }
    this.setupPositionProbePattern(0, 0);
    this.setupPositionProbePattern(this.moduleCount - 7, 0);
    this.setupPositionProbePattern(0, this.moduleCount - 7);

  setupPositionProbePattern: function (row, col) {

        if ((0 <= r && r <= 6 && (c === 0 || c === 6)) || (0 <= c && c <= 6 && (r === 0 || r === 6)) || (2 <= r && r <= 4 && 2 <= c && c <= 4)) this.modules[row + r][col + c] = true;
        else this.modules[row + r][col + c] = false;

    }

  getBestMaskPattern: function () {
    var minLostPoint = 0, pattern = 0;
    for (var i = 0; i < 8; i++) {
      this.makeImpl(true, i);

QRCodeModel.PAD0 = 0xEC;
QRCodeModel.PAD1 = 0x11;
QRCodeModel.createData = function (typeNumber, errorCorrectLevel, dataList) {
  var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);

  for (var i = 0; i < dataList.length; i++) {
    var data = dataList[i];

    buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber));
    data.write(buffer);
  }

  for (var i = 0; i < rsBlocks.length; i++) totalDataCount += rsBlocks[i].dataCount;

  if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) buffer.put(0, 4);
  while (buffer.getLengthInBits() % 8 !== 0) buffer.putBit(false);

QRCodeModel.createBytes = function (buffer, rsBlocks) {
  var offset = 0, maxDcCount = 0, maxEcCount = 0;

    var dcCount = rsBlocks[r].dataCount, ecCount = rsBlocks[r].totalCount - dcCount;

    maxEcCount = Math.max(maxEcCount, ecCount);
    dcdata[r] = new Array(dcCount);
    for (var i = 0; i < dcdata[r].length; i++) dcdata[r][i] = 0xff & buffer.buffer[i + offset];
    offset += dcCount;
    var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
    var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);
    var modPoly = rawPoly.mod(rsPoly);
    ecdata[r] = new Array(rsPoly.getLength() - 1);
    for (var i = 0; i < ecdata[r].length; i++) { var modIndex = i + modPoly.getLength() - ecdata[r].length; ecdata[r][i] = (modIndex >= 0) ? modPoly.get(modIndex) : 0; }

  var totalCodeCount = 0;
  for (var i = 0; i < rsBlocks.length; i++) totalCodeCount += rsBlocks[i].totalCount;

  for (var i = 0; i < maxDcCount; i++) for (var r = 0; r < rsBlocks.length; r++) if (i < dcdata[r].length) data[index++] = dcdata[r][i];

// Auto-select the smallest QR version (1-40) that fits `text` at the given error-correction level.
function makeQRCode(text, ecLevel) {
  ecLevel = (ecLevel === undefined) ? QRErrorCorrectLevel.M : ecLevel;
  for (var typeNumber = 1; typeNumber <= 40; typeNumber++) {
    try {
      var qr = new QRCodeModel(typeNumber, ecLevel);
      qr.addData(String(text));
      qr.make();
      return qr;
    } catch (e) {
      if (typeNumber === 40) throw e;
      continue;
    }
  }
}

// Renders a scannable QR as a self-contained SVG on a solid white plate (always
// black-on-white, regardless of app theme, so it stays reliably scannable whether
// the page is in light or dark mode). `size` is the outer plate size in px.
function qrCodeSvg(text, size){
  size = size || 160;
  var qr;
  try { qr = makeQRCode(text, QRErrorCorrectLevel.M); } catch(e){ return '<div style="width:'+size+'px;height:'+size+'px;"></div>'; }
  var n = qr.getModuleCount();
  var quiet = 4; // modules of quiet zone — required for reliable scanning
  var total = n + quiet*2;
  var cell = size/total;
  var rects = '';
  for(var r=0;r<n;r++){
    for(var c=0;c<n;c++){
      if(qr.isDark(r,c)){
        rects += '<rect x="'+((c+quiet)*cell).toFixed(2)+'" y="'+((r+quiet)*cell).toFixed(2)+'" width="'+(cell+0.75).toFixed(2)+'" height="'+(cell+0.75).toFixed(2)+'"/>';
      }
    }
  }
  return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" shape-rendering="crispEdges" role="img" aria-label="QR code">'+
    '<rect x="0" y="0" width="'+size+'" height="'+size+'" fill="#ffffff"/>'+
    '<g fill="#0a0a0a">'+rects+'</g>'+
  '</svg>';
}
// A QR on its own white plate with a small margin/border — the piece to drop into
// any card, regardless of that card's own background color or the current theme.
function qrPlate(text, size, plateSize){
  size = size || 132; plateSize = plateSize || (size + 20);
  return '<div style="display:inline-flex;align-items:center;justify-content:center;width:'+plateSize+'px;height:'+plateSize+'px;background:#ffffff;border-radius:12px;box-shadow:var(--shadow);">'+qrCodeSvg(text, size)+'</div>';
}
</script>

<script>
/* ======================================================================
   CHARTS (hand-built inline SVG — no external chart library)
   ====================================================================== */
function sparkline(values, opts){
  opts = opts||{};
  const w = opts.width||72, h = opts.height||26, pad=2;
  const max = Math.max(...values, 1), min = Math.min(...values, 0);
  const range = (max-min)||1;
  const stepX = (w-pad*2)/(values.length-1||1);
  const pts = values.map((v,i)=>[pad+i*stepX, h-pad-((v-min)/range)*(h-pad*2)]);
  const line = pts.map(p=>p.join(',')).join(' ');
  const areaPath = 'M'+pts[0][0]+','+(h-pad)+' L'+line.split(' ').join(' L')+' L'+pts[pts.length-1][0]+','+(h-pad)+' Z';
  const last = pts[pts.length-1];
  return '<svg width="'+w+'" height="'+h+'" class="sparkline" viewBox="0 0 '+w+' '+h+'" aria-hidden="true">'+
    '<path d="'+areaPath+'" fill="var(--accent)" opacity="0.12"/>'+
    '<polyline points="'+line+'" fill="none" stroke="var(--accent)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="2.6" fill="var(--accent)" stroke="var(--chart-surface)" stroke-width="1.5"/>'+
    '</svg>';
}

// Single-series horizontal bar chart for nominal categories — one color (accent) for every bar, direct labels.
function truncateLabel(s, n){ s=String(s); return s.length>n ? s.slice(0,n-1)+'…' : s; }
function hBarChart(data, opts){
  opts = opts||{};
  const rowH = opts.rowH||26, gap=10, labelW=opts.labelW||152, w=opts.width||460;
  const maxChars = Math.round(labelW/6.6);
  const max = Math.max(...data.map(d=>d.value),1);
  const barAreaW = w - labelW - 54;
  const h = data.length*(rowH+gap)-gap;
  let rows='';
  data.forEach((d,i)=>{
    const y = i*(rowH+gap);
    const bw = Math.max(3,(d.value/max)*barAreaW);
    const labelInside = bw > 46;
    rows += '<g>'+
      '<text x="0" y="'+(y+rowH/2+4)+'" font-size="12" fill="var(--text-secondary)">'+esc(truncateLabel(d.label,maxChars))+'<title>'+esc(d.label)+'</title></text>'+
      '<rect x="'+labelW+'" y="'+y+'" width="'+barAreaW+'" height="'+rowH+'" rx="'+(rowH/2)+'" fill="var(--surface-3)" opacity="0.5"/>'+
      '<rect x="'+labelW+'" y="'+y+'" width="'+bw+'" height="'+rowH+'" rx="6" fill="'+(d.color||'var(--accent)')+'">'+
        '<title>'+esc(d.label)+': '+d.value+'</title>'+
      '</rect>'+
      (labelInside
        ? '<text x="'+(labelW+bw-10)+'" y="'+(y+rowH/2+4)+'" font-size="11.5" text-anchor="end" fill="var(--accent-fg)" font-weight="700">'+d.value+'</text>'
        : '<text x="'+(labelW+bw+8)+'" y="'+(y+rowH/2+4)+'" font-size="11.5" fill="var(--text-primary)" font-weight="700">'+d.value+'</text>')+
    '</g>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" role="img" aria-label="bar chart" style="direction:ltr;">'+rows+'</svg>';
}

// Single-series line/area chart with hover crosshair + native-title point markers.
function lineAreaChart(points, opts){
  opts = opts||{};
  const w = opts.width||600, h = opts.height||190;
  const padL=36, padR=10, padT=14, padB=26;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const values = points.map(p=>p.value);
  const max = Math.max(...values,1)*1.15;
  const min = 0;
  const stepX = plotW/((points.length-1)||1);
  const xy = points.map((p,i)=>[padL+i*stepX, padT+plotH-((p.value-min)/(max-min))*plotH]);
  const linePts = xy.map(p=>p.join(',')).join(' ');
  const areaPath = 'M'+xy[0][0]+','+(padT+plotH)+' L'+linePts.split(' ').join(' L')+' L'+xy[xy.length-1][0]+','+(padT+plotH)+' Z';
  // gridlines (4 steps)
  let grid='';
  const steps=4;
  for(let i=0;i<=steps;i++){
    const gy = padT + plotH - (i/steps)*plotH;
    const val = Math.round((max/steps)*i);
    grid += '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--grid)" stroke-width="1"/>';
    grid += '<text x="'+(padL-8)+'" y="'+(gy+3)+'" font-size="10" text-anchor="end" fill="var(--text-muted)">'+compactNum(val)+'</text>';
  }
  // x labels — show all if <=8, else every other
  const showEvery = points.length<=8?1:(points.length<=16?2:5);
  let xlabels='';
  points.forEach((p,i)=>{
    if(i%showEvery!==0 && i!==points.length-1) return;
    xlabels += '<text x="'+xy[i][0]+'" y="'+(h-6)+'" font-size="10" text-anchor="middle" fill="var(--text-muted)">'+esc(p.label)+'</text>';
  });
  let dots='';
  xy.forEach((p,i)=>{
    const isLast = i===xy.length-1;
    dots += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(isLast?4.5:3.5)+'" fill="var(--accent)" stroke="var(--chart-surface)" stroke-width="2">'+
      '<title>'+esc(points[i].label)+': '+points[i].value+'</title></circle>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" role="img" aria-label="line chart" style="direction:ltr;">'+
    grid+
    '<path d="'+areaPath+'" fill="var(--accent)" opacity="0.10"/>'+
    '<polyline points="'+linePts+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
    dots+xlabels+
  '</svg>';
}

// Legend row for multi-series charts — array of {label, color}.
function chartLegend(series){
  return '<div class="chart-legend">'+series.map(s=>'<span><i style="background:'+s.color+';"></i>'+esc(s.label)+'</span>').join('')+'</div>';
}

// Multi-series line/area chart. series: [{label,color,values:[...]}] all aligned to `labels`.
function multiLineChart(series, labels, opts){
  opts = opts||{};
  const w = opts.width||600, h = opts.height||220;
  const padL=36, padR=10, padT=14, padB=26;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const allVals = series.reduce((acc,s)=>acc.concat(s.values),[]);
  const max = Math.max(...allVals,1)*1.15;
  const min = 0;
  const stepX = plotW/((labels.length-1)||1);
  let grid='';
  const steps=4;
  for(let i=0;i<=steps;i++){
    const gy = padT + plotH - (i/steps)*plotH;
    const val = Math.round((max/steps)*i);
    grid += '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--grid)" stroke-width="1"/>';
    grid += '<text x="'+(padL-8)+'" y="'+(gy+3)+'" font-size="10" text-anchor="end" fill="var(--text-muted)">'+compactNum(val)+'</text>';
  }
  const showEvery = labels.length<=8?1:(labels.length<=16?2:5);
  let xlabels='';
  labels.forEach((lb,i)=>{
    if(i%showEvery!==0 && i!==labels.length-1) return;
    xlabels += '<text x="'+(padL+i*stepX)+'" y="'+(h-6)+'" font-size="10" text-anchor="middle" fill="var(--text-muted)">'+esc(lb)+'</text>';
  });
  let paths='';
  series.forEach(s=>{
    const xy = s.values.map((v,i)=>[padL+i*stepX, padT+plotH-((v-min)/(max-min))*plotH]);
    const linePts = xy.map(p=>p.join(',')).join(' ');
    if(opts.area){
      const areaPath = 'M'+xy[0][0]+','+(padT+plotH)+' L'+linePts.split(' ').join(' L')+' L'+xy[xy.length-1][0]+','+(padT+plotH)+' Z';
      paths += '<path d="'+areaPath+'" fill="'+s.color+'" opacity="0.10"/>';
    }
    paths += '<polyline points="'+linePts+'" fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
    xy.forEach((p,i)=>{
      paths += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="'+s.color+'" stroke="var(--chart-surface)" stroke-width="1.5"><title>'+esc(s.label)+' · '+esc(labels[i])+': '+s.values[i]+'</title></circle>';
    });
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" role="img" aria-label="line chart" style="direction:ltr;">'+grid+paths+xlabels+'</svg>';
}

// Donut/ring chart. data: [{label,value,color}]. opts:{size,thickness,centerValue,centerLabel}.
function donutChart(data, opts){
  opts = opts||{};
  const size = opts.size||160, thickness = opts.thickness||22;
  const r = (size-thickness)/2, cx = size/2, cy = size/2;
  const circumference = 2*Math.PI*r;
  const total = data.reduce((s,d)=>s+d.value,0) || 1;
  let offset = 0, segs = '';
  data.forEach(d=>{
    const frac = d.value/total;
    const len = Math.max(0, frac*circumference - (data.length>1?1.5:0));
    segs += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+d.color+'" stroke-width="'+thickness+'" stroke-linecap="round" '+
      'stroke-dasharray="'+len+' '+(circumference-len)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 '+cx+' '+cy+')">'+
      '<title>'+esc(d.label)+': '+d.value+' ('+Math.round(frac*100)+'%)</title></circle>';
    offset += frac*circumference;
  });
  const centerText = opts.centerValue!=null ?
    '<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-size="20" font-weight="700" fill="var(--text-primary)">'+esc(opts.centerValue)+'</text>'+
    '<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" font-size="10" fill="var(--text-muted)">'+esc(opts.centerLabel||'')+'</text>' : '';
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="donut chart" style="flex:none;direction:ltr;">'+segs+centerText+'</svg>';
}

// Vertical bar chart for nominal categories — supports optional per-item d.color.
function vBarChart(data, opts){
  opts = opts||{};
  const w = opts.width||600, h = opts.height||180;
  const padL=32, padR=10, padT=10, padB=26;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const max = Math.max(...data.map(d=>d.value),1)*1.15;
  const gap = opts.gap!=null?opts.gap:8;
  const barW = (plotW - gap*(data.length-1))/data.length;
  let grid='';
  const steps=3;
  for(let i=0;i<=steps;i++){
    const gy = padT + plotH - (i/steps)*plotH;
    grid += '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--grid)" stroke-width="1"/>';
  }
  const maxChars = Math.max(3, Math.floor(barW/5.4));
  let bars='';
  data.forEach((d,i)=>{
    const x = padL + i*(barW+gap);
    const bh = Math.max(2,(d.value/max)*plotH);
    const y = padT+plotH-bh;
    bars += '<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+bh+'" rx="3" fill="'+(d.color||'var(--accent)')+'">'+
      '<title>'+esc(d.label)+': '+d.value+'</title></rect>'+
      '<text x="'+(x+barW/2)+'" y="'+(padT+plotH+16)+'" font-size="9.5" text-anchor="middle" fill="var(--text-muted)">'+esc(truncateLabel(d.label,maxChars))+'<title>'+esc(d.label)+'</title></text>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" role="img" aria-label="bar chart" style="direction:ltr;">'+grid+bars+'</svg>';
}

</script>

function pendingApprovalsCount(){
  // Tower mode has no Pre-Registration module — Gate Pass replaces it — so its pending count
  // comes from gatePasses (only ever non-zero when "Host approval required" is on; see
  // gatePassForm's submit handler) instead of invites.
  const preCount = isTowerMode() ? state.gatePasses.filter(g=>g.status==='pending').length : state.invites.filter(i=>i.status==='pending').length;
  return preCount + state.visitors.filter(v=>v.status==='pending-approval').length;
}
function renderSidebar(){
  const count = pendingApprovalsCount();
  let html = '<div class="brand"><img class="brand-logo" src="'+APP_LOGO_DATA_URI+'" alt="'+esc(t('appName'))+'"></div>';
  html += '<nav class="navlist">';
  const businessMode = state.settings.businessMode || 'employees';
  NAV_SECTIONS.forEach(sec=>{
    const items = sec.items.filter(it=>!it.mode || it.mode===businessMode);
    if(!items.length) return;
    html += '<div class="navlabel">'+esc(t('nav.section.'+sec.key))+'</div>';
    items.forEach(it=>{
      const active = ui.view===it.key;
      html += '<button class="navitem'+(active?' active':'')+'" data-action="nav" data-key="'+it.key+'">'+
        icon(it.icon)+'<span>'+esc(t('nav.'+it.key))+'</span>'+
        (it.badge && count>0 ? '<span class="nbadge">'+count+'</span>' : '')+
      '</button>';
    });
  });
  html += '</nav>';
  html += '<div class="sidebar-foot"><button class="navitem" data-action="signout">'+icon('logout')+'<span>'+esc(t('signOut'))+'</span></button></div>';
  document.getElementById('sidebar').innerHTML = html;
}

// Every page whose own filter-bar has a real text search bound to ui[view].search — the
// topbar's global search box mirrors/drives that exact field live when the current page is
// one of these (see renderTopbar and the globalSearchInput input/keydown handlers below).
const GLOBAL_SEARCH_VIEWS = ['visitors','blacklist','evacuation','employees','users'];
const GLOBAL_SEARCH_PLACEHOLDER_KEY = { employees:'employees.searchPh', users:'users.searchPh', evacuation:'evacuation.findPerson' };
function renderTopbar(){
  const titleKey = { dashboard:'dash.title', visitors:'visitors.title', checkin:'checkin.title', invites:'invites.title',
    approvals:'approvals.title', blacklist:'blacklist.title', evacuation:'evacuation.title', badges:'badges.title', agreements:'agreements.title', reports:'reports.title',
    employees:'employees.title', tower:'tower.title', gatepass:'gatepass.title', users:'users.title', notifications:'notif.title', settings:'settings.title' }[ui.view];
  let html = '<button class="icon-btn menu-toggle" data-action="toggle-sidebar">'+icon('menu')+'</button>';
  html += '<div class="site-select-wrap">'+fauxSelect('global-site', [['all', t('allSites')]].concat(state.sites.map(s=>[s.id, state.lang==='ar'?s.nameAr:s.name])), state.site, {kind:'site', cls:'pillselect-fs'})+'</div>';
  // On any page that has its own list search (see GLOBAL_SEARCH_VIEWS), this mirrors that
  // page's own ui[view].search — the exact value its own filter-bar search box reads/writes —
  // so the two stay in sync and typing here filters immediately, exactly like every other
  // search box in the app, instead of silently doing nothing until Enter is pressed, which is
  // what made it read as broken. On every other page (no local search to sync with) it's a
  // quick "jump to Visitor Log with this search applied" shortcut instead (Enter to go).
  const searchSyncView = GLOBAL_SEARCH_VIEWS.includes(ui.view) ? ui.view : null;
  const globalSearchVal = searchSyncView ? ui[searchSyncView].search : ui.globalSearch;
  const globalSearchPh = t(GLOBAL_SEARCH_PLACEHOLDER_KEY[ui.view] || 'searchPlaceholder');
  html += '<div class="searchbox">'+icon('search')+'<input type="text" id="globalSearchInput" placeholder="'+esc(globalSearchPh)+'" value="'+esc(globalSearchVal)+'" data-action="global-search"></div>';
  html += '<div class="topbar-spacer"></div>';
  html += '<div class="qa-wrap">'+
    '<button class="icon-btn qa-trigger'+(ui.quickActions.open?' active':'')+'" data-action="toggle-quick-actions" title="'+esc(t('qa.title'))+'">'+icon('zap')+'</button>'+
    (ui.quickActions.open ? renderQuickActionsPopover() : '')+
  '</div>';
  html += themeToggleHtml();
  html += '<div class="langtoggle"><button data-action="set-lang" data-lang="en" class="'+(state.lang==='en'?'active':'')+'">EN</button><button data-action="set-lang" data-lang="ar" class="'+(state.lang==='ar'?'active':'')+'">AR</button></div>';
  html += '<button class="icon-btn" data-action="nav" data-key="notifications" title="'+esc(t('nav.notifications'))+'">'+icon('bell')+(pendingApprovalsCount()>0?'<span class="nbadge" style="position:absolute;top:2px;inset-inline-end:2px;">'+pendingApprovalsCount()+'</span>':'')+'</button>';

// Employee mode's pool of "still checkin-able today" pre-registrations — pending/approved
// invites whose visitDate is today. Past-due invites have already been flipped to 'expired'
// by expireOverdueInvites() (called every render), which drops them out of the pending/approved
// filter on its own; the visitDate===today check on top of that also keeps a not-yet-due future
// invite from showing up as checkin-able before its day arrives. Shared by the Check-In page's
// "pending today" section and the Quick Actions Check In search, so the two always agree.
function pendingInvitesToday(){
  const today = todayStr();
  return bySite(state.invites).filter(i=> ['pending','approved'].includes(i.status)
    && (i.visitDate || (i.scheduled?i.scheduled.slice(0,10):'')) === today);
}
// Pool of arrivals the "Check In" quick action can check in — active Gate Passes (visitor and
// delivery together, same as the Tower Check-In page) in Tower mode, or today's pending/approved
// Pre-Registrations (see pendingInvitesToday()) in Employee mode.
function qaCheckinPool(){
  return isTowerMode()
    ? bySite(state.gatePasses).filter(g=>g.status==='active')
    : pendingInvitesToday();
}

  const mode = ui.quickActions.mode;

  // in / visitors currently on-site to check out) — visible without switching mode first.

    return '<button type="button" class="qa-modebtn'+(mode===key?' active':'')+'" data-action="set-quickaction-mode" data-mode="'+key+'">'+

      icon(iconName)+'<span>'+esc(label)+'</span></button>';

    '<div class="qa-popover-head"><h4>'+t('qa.title')+'</h4><button type="button" class="icon-btn" data-action="close-quick-actions">'+icon('x')+'</button></div>'+

function renderQaCheckinSearch(){
  const d = ui.drafts.quickAction;

function render(){
  if(expireOverdueInvites()) saveState();
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang==='ar' ? 'rtl' : 'ltr';
  applyTheme();
  // preserve focus + selection + scroll across full re-render
  // Most form fields are plain data-bind inputs with no id, so on every keystroke
  // (handleBindChange calls render() synchronously) the old DOM node is destroyed
  // and focus would be lost after a single character unless we can re-find the
  // freshly-rendered replacement. Prefer id when present, else fall back to a
  // selector built from data-bind / data-filter-view+data-filter-field, which is
  // stable across re-renders since the same field always carries the same attrs.
  const active = document.activeElement;
  let focusInfo = null;
  if(active && active!==document.body){
    let selector = null;
    if(active.id && active.id !== 'undefined'){ selector = '#'+CSS.escape(active.id); }
    else if(active.getAttribute && active.getAttribute('data-fs-input')){ selector = '[data-fs-input="'+CSS.escape(active.getAttribute('data-fs-input'))+'"]'; }
    else if(active.getAttribute && active.getAttribute('data-dp-input')){ selector = '[data-dp-input="'+CSS.escape(active.getAttribute('data-dp-input'))+'"]'; }
    else if(active.getAttribute && active.getAttribute('data-bind')){ selector = '[data-bind="'+CSS.escape(active.getAttribute('data-bind'))+'"]'; }
    else if(active.getAttribute && active.getAttribute('data-filter-field')){
      const fv = active.getAttribute('data-filter-view')||'';
      selector = '[data-filter-view="'+CSS.escape(fv)+'"][data-filter-field="'+CSS.escape(active.getAttribute('data-filter-field'))+'"]';
    }
    if(selector){ focusInfo = { selector, start: active.selectionStart, end: active.selectionEnd }; }
  }
  const mainEl = document.getElementById('main');
  const scrollTop = mainEl ? mainEl.scrollTop : 0;
  // Long forms (e.g. Pre-Registration) scroll inside their own .modal-body, not #main —
  // without preserving this separately, any render() triggered while scrolled down
  // (picking a host from the search combo, typing into a field, toggling a checkbox...)
  // snaps the modal's internal scroll back to the top, which reads as "it jumped back
  // to the first field" even though nothing about the form itself actually changed.
  const modalBodyEl = document.querySelector('#modalroot .modal-body');
  const modalScrollTop = modalBodyEl ? modalBodyEl.scrollTop : 0;

  const appEl = document.getElementById('app');
  const authEl = document.getElementById('authRoot');
  if(isLoggedIn()){
    if(appEl) appEl.classList.remove('hidden');
    if(authEl) authEl.classList.add('hidden');
    renderSidebar();
    renderTopbar();
    renderMain();
  } else {
    if(appEl) appEl.classList.add('hidden');
    if(authEl) authEl.classList.remove('hidden');
    renderAuthRoot();
  }
  renderModal();
  renderToasts();
  const sbEl = document.getElementById('sidebar');
  if(sbEl) sbEl.classList.toggle('open', !!ui.sidebarOpen);
  const bdEl = document.getElementById('sidebarBackdrop');
  if(bdEl) bdEl.classList.toggle('open', !!ui.sidebarOpen);

  const mainEl2 = document.getElementById('main');
  if(mainEl2) mainEl2.scrollTop = scrollTop;
  const modalBodyEl2 = document.querySelector('#modalroot .modal-body');
  if(modalBodyEl2) modalBodyEl2.scrollTop = modalScrollTop;
  if(focusInfo){
    let el = null;
    try{ el = document.querySelector(focusInfo.selector); }catch(e){}
    if(el){
      el.focus();
      // Some input types (email, number, date, time, ...) throw on setSelectionRange —
      // it's simply unsupported per spec for those types, not a sign anything is wrong.
      // When that happens, fall back to a value-reassignment trick that reliably parks
      // the caret at the end of the text, which matches how people actually type
      // (appending), rather than leaving the caret at position 0 where the next
      // keystroke would silently prepend and scramble everything already typed.
      let positioned = false;
      if(typeof el.setSelectionRange === 'function' && focusInfo.start!=null){
        try{ el.setSelectionRange(focusInfo.start, focusInfo.end); positioned = true; }catch(e){}
      }
      if(!positioned){
        try{ const v = el.value; el.value=''; el.value=v; }catch(e){}
      }
    }
  }
  repositionComboDropdowns();
}
// A combo dropdown (see CHECKIN_COMBOS) is positioned absolute-under-its-input by default,
// which is fine on a plain page but gets silently clipped when the combo lives inside a
// scrolling container — e.g. the Pre-Registration form's scrollable modal body. When that's
// open, re-anchor the dropdown with `position:fixed` computed from the input's live
// bounding box so it always renders on top instead of being cut off. CHECKIN_COMBOS is
// defined later in this file, but this only ever runs from a render() call made after the
// whole script has executed once, by which point it's already populated.
function repositionOneComboDropdown(wrap){
  if(!wrap) return;
  const dd = wrap.querySelector('.combo-dropdown');
  const input = wrap.querySelector('.combo-input');
  if(!dd || !input) return;
  let clipped = false;
  let node = wrap.parentElement;
  while(node && node!==document.body){
    const cs = getComputedStyle(node);
    if(/(auto|scroll|hidden)/.test(cs.overflowY) || /(auto|scroll|hidden)/.test(cs.overflowX)){ clipped = true; break; }
    node = node.parentElement;
  }
  if(!clipped) return;
  const r = input.getBoundingClientRect();
  // Some dropdowns are deliberately wider than their trigger via a CSS override (e.g.
  // ".pagesize-select .combo-dropdown{width:110px}", so "Rows per page" options like "500"
  // and "All" aren't cramped next to the selected checkmark). Read that intended width while
  // the element is still in normal flow — before switching to position:fixed, which would
  // otherwise collapse it down to the (narrower) trigger's own width — and never go below it.
  const cssWidth = dd.getBoundingClientRect().width;
  const targetWidth = Math.max(r.width, cssWidth);
  dd.style.position = 'fixed';
  dd.style.insetInlineStart = 'auto';
  dd.style.insetInlineEnd = 'auto';
  dd.style.left = r.left + 'px';
  dd.style.width = targetWidth + 'px';
  dd.style.zIndex = '3000';
  // Escaping the clipping ancestor via position:fixed isn't enough on its own — a trigger
  // near the bottom of the viewport (e.g. the "rows per page" control in a table footer)
  // would still open downward, run past the bottom of the screen, and leave its lower options
  // permanently unreachable (there's nothing left to scroll — #main is already at its max
  // scrollTop). Flip the panel above the trigger instead whenever there isn't room below it,
  // and cap its height to whichever side actually has more room so it can never spill
  // off-screen either way.
  const ddMaxHeight = parseFloat(getComputedStyle(dd).maxHeight) || 250;
  const wantHeight = Math.min(dd.scrollHeight || ddMaxHeight, ddMaxHeight);
  const spaceBelow = window.innerHeight - r.bottom - 6;
  const spaceAbove = r.top - 6;
  const openUp = spaceBelow < wantHeight && spaceAbove > spaceBelow;
  if(openUp){
    dd.style.top = 'auto';
    dd.style.bottom = (window.innerHeight - r.top + 6) + 'px';
    dd.style.maxHeight = Math.max(120, spaceAbove) + 'px';
  } else {
    dd.style.bottom = 'auto';
    dd.style.top = (r.bottom + 6) + 'px';
    dd.style.maxHeight = Math.max(120, spaceBelow) + 'px';
  }
}
// Same escape-the-clipping-ancestor idea as repositionOneComboDropdown() above, but for the
// datePicker() calendar panel (.dp-panel) rather than a fauxSelect .combo-dropdown — kept as
// its own function rather than folded into that one because a calendar panel has a small,
// fixed, non-scrolling height (no need for the max-height/scroll-truncation logic that exists
// there to keep a long option list on-screen), so it only needs the position:fixed + flip
// up/down piece.
function repositionOneDatePanel(wrap){
  if(!wrap) return;
  const panel = wrap.querySelector('.dp-panel');
  const trigger = wrap.querySelector('[data-action="open-datepicker"]');
  if(!panel || !trigger) return;
  let clipped = false;
  let node = wrap.parentElement;
  while(node && node!==document.body){
    const cs = getComputedStyle(node);
    if(/(auto|scroll|hidden)/.test(cs.overflowY) || /(auto|scroll|hidden)/.test(cs.overflowX)){ clipped = true; break; }
    node = node.parentElement;
  }
  if(!clipped) return;
  const r = trigger.getBoundingClientRect();
  const panelWidth = panel.getBoundingClientRect().width || 264;
  panel.style.position = 'fixed';
  panel.style.insetInlineStart = 'auto';
  panel.style.insetInlineEnd = 'auto';
  panel.style.left = r.left + 'px';
  panel.style.width = panelWidth + 'px';
  panel.style.zIndex = '3000';
  const wantHeight = panel.scrollHeight || 320;
  const spaceBelow = window.innerHeight - r.bottom - 6;
  const spaceAbove = r.top - 6;
  const openUp = spaceBelow < wantHeight && spaceAbove > spaceBelow;
  if(openUp){
    panel.style.top = 'auto';
    panel.style.bottom = (window.innerHeight - r.top + 6) + 'px';
  } else {
    panel.style.bottom = 'auto';
    panel.style.top = (r.bottom + 6) + 'px';
  }
}
function repositionComboDropdowns(){
  if(ui.openDatepicker){
    let dpWrap = null;
    try{ dpWrap = document.querySelector('[data-datepicker="'+CSS.escape(ui.openDatepicker)+'"]'); }catch(e){}
    repositionOneDatePanel(dpWrap);
  }
  if(typeof CHECKIN_COMBOS!=='undefined'){
    Object.keys(CHECKIN_COMBOS).forEach(function(inputId){
      const combo = CHECKIN_COMBOS[inputId];
      const st = combo.state();
      if(!st || !st.open) return;
      let wrap = null;
      try{ wrap = document.querySelector(combo.wrap); }catch(e){}
      repositionOneComboDropdown(wrap);
    });
  }
  // fauxSelect() dropdowns (see that function) are dynamic — any select() field, filter-bar
  // select, or the topbar site picker can be the one currently open — so instead of a static
  // registry like CHECKIN_COMBOS, just look up whichever one ui.openFauxselect names.
  if(ui.openFauxselect){
    let wrap = null;
    try{ wrap = document.querySelector('[data-fauxselect="'+CSS.escape(ui.openFauxselect)+'"]'); }catch(e){}
    repositionOneComboDropdown(wrap);
  }
}
function go(view){ ui.view = view; ui.sidebarOpen=false; render(); }
</script>

<script>
/* ======================================================================
   SHARED DATA HELPERS
   ====================================================================== */
function bySite(list){ return state.site==='all' ? list : list.filter(x=>x.site===state.site); }
function visitorsOn(list, dayOffset){ const d=new Date(); d.setDate(d.getDate()-dayOffset); return list.filter(v=>isSameDay(new Date(v.checkIn), d)); }
function activeVisitors(){ return bySite(state.visitors).filter(v=>v.status==='checked-in'); }

/* ======================================================================
   DASHBOARD
   ====================================================================== */
VIEW_RENDERERS.dashboard = function(){
  const scoped = bySite(state.visitors);
  const todayV = visitorsOn(scoped, 0);
  const yestV = visitorsOn(scoped, 1);
  const delta = todayV.length - yestV.length;
  const onsite = scoped.filter(v=>v.status==='checked-in');
  const pendingWalkins = scoped.filter(v=>v.status==='pending-approval');
  const pendingInvites = bySite(state.invites).filter(i=>i.status==='pending');
  const pendingCount = pendingWalkins.length + pendingInvites.length;
  const watchMatches = scoped.filter(v=>v.watchMatch && daysDiff(new Date(), new Date(v.checkIn))<=30).length;

  const spark = Array.from({length:7},(_,i)=>visitorsOn(scoped,6-i).length);
  const weekPts = spark.map((v,i)=>({label: new Date(Date.now()-(6-i)*86400000).toLocaleDateString(state.lang==='ar'?'ar-AE':'en-AE',{weekday:'short'}), value:v}));

  const purposeCounts = {};
  visitorsOn(scoped,0).concat(...Array.from({length:6},(_,i)=>visitorsOn(scoped,i+1))).forEach(v=>{ purposeCounts[v.purpose]=(purposeCounts[v.purpose]||0)+1; });
  const purposeData = Object.entries(purposeCounts).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([label,value])=>({label,value}));

  const onPremises = onsite.slice().sort((a,b)=>new Date(b.checkIn)-new Date(a.checkIn)).slice(0,6);
  const upcoming = bySite(state.invites).filter(i=>['approved','pending'].includes(i.status) && new Date(i.scheduled)>=startOfDay(new Date())).sort((a,b)=>new Date(a.scheduled)-new Date(b.scheduled)).slice(0,5);

  return ''+
  '<div class="pagehead"><div><h1>'+t('dash.title')+'</h1><div class="sub">'+t('dash.sub')+'</div></div>'+
    '<div class="pagehead-actions"><button class="btn btn-primary" data-action="nav" data-key="checkin">'+icon('userPlus')+t('visitors.newCheckin')+'</button></div></div>'+

  '<div class="grid grid-4" style="margin-bottom:16px;">'+
    statTile(t('dash.statToday'), todayV.length, delta, spark, t('dash.vsYesterday'))+
    statTile(t('dash.statOnsite'), onsite.length, null, null, t('dash.acrossSites',{n:state.sites.length}))+
    statTile(t('dash.statPending'), pendingCount, null, null, pendingCount>0? '<a href="#" data-action="nav" data-key="approvals" style="color:var(--accent);font-weight:600;">'+t('nav.approvals')+' →</a>' : '')+
    statTileStatus(t('dash.statWatch'), watchMatches)+
  '</div>'+

  '<div class="grid grid-2" style="margin-bottom:16px;">'+
    '<div class="chartcard"><div class="section-title">'+t('dash.weeklyTraffic')+'</div><div class="section-sub">'+t('dash.weeklyTrafficSub')+'</div>'+lineAreaChart(weekPts,{height:180})+'</div>'+
    '<div class="chartcard"><div class="section-title">'+t('dash.byPurpose')+'</div><div class="section-sub">'+t('dash.byPurposeSub')+'</div>'+(purposeData.length?hBarChart(purposeData,{rowH:22}):emptyState('chart'))+'</div>'+
  '</div>'+

  '<div class="grid grid-2">'+
    '<div class="card">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><div class="section-title" style="margin:0;">'+t('dash.onPremises')+'</div><button class="btn btn-ghost btn-sm" data-action="nav" data-key="visitors">'+t('dash.viewAll')+'</button></div>'+
      (onPremises.length? onPremises.map(v=>rowMini(v)).join('') : '<div class="empty-state" style="padding:24px;">'+t('dash.noOnsite')+'</div>')+
    '</div>'+
    '<div class="card">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><div class="section-title" style="margin:0;">'+t('dash.upcoming')+'</div><button class="btn btn-ghost btn-sm" data-action="nav" data-key="'+(isTowerMode()?'gatepass':'invites')+'">'+t('dash.viewAll')+'</button></div>'+
      (upcoming.length? upcoming.map(i=>inviteMini(i)).join('') : '<div class="empty-state" style="padding:24px;">'+t('dash.noUpcoming')+'</div>')+
    '</div>'+
  '</div>';
};

function statTile(label, value, delta, sparkVals, footHtml){
  return '<div class="stat-tile">'+
    '<div class="stat-label">'+esc(label)+'</div>'+
    '<div class="stat-value-row"><span class="stat-value tabular">'+value+'</span>'+
      (delta!=null ? '<span class="stat-delta '+(delta>=0?'up':'down')+'">'+(delta>=0?'+':'')+delta+'</span>' : '')+
    '</div>'+
    '<div class="stat-foot"><span class="txt">'+(footHtml||'')+'</span>'+(sparkVals?sparkline(sparkVals):'')+'</div>'+
  '</div>';
}
function statTileStatus(label, count){
  const ok = count===0;
  return '<div class="stat-tile">'+
    '<div class="stat-label">'+esc(label)+'</div>'+
    '<div class="stat-value-row"><span class="stat-value tabular" style="color:'+(ok?'var(--good)':'var(--critical)')+';">'+count+'</span></div>'+
    '<div class="stat-foot"><span class="chip '+(ok?'chip-good':'chip-critical')+'">'+(ok?t('dash.clear'):t('dash.needAttention'))+'</span></div>'+
  '</div>';
}
// Icon-badge stat card with a colored trend-arrow delta — used by Reports & Analytics.
function reportStatCard(iconName, tint, value, label, deltaPct){
  const up = deltaPct>=0;
  return '<div class="card" style="padding:16px 18px;">'+
    '<div class="hstack" style="justify-content:space-between;align-items:flex-start;margin-bottom:14px;">'+
      '<div class="avatar-sq icon-tint-'+tint+'" style="border-radius:10px;width:38px;height:38px;">'+icon(iconName)+'</div>'+
      '<span class="stat-delta '+(up?'up':'down')+'" style="display:inline-flex;align-items:center;gap:2px;">'+icon(up?'trendUp':'trendDown')+(up?'+':'')+deltaPct+'%</span>'+
    '</div>'+
    '<div class="tabular" style="font-size:24px;font-weight:700;line-height:1;">'+esc(value)+'</div>'+
    '<div class="cell-sub" style="margin-top:6px;">'+esc(label)+'</div>'+
  '</div>';
}
function emptyState(iconName, label){ return '<div class="empty-state">'+icon(iconName)+'<div>'+(label||t('noResults'))+'</div></div>'; }

function rowMini(v){
  return '<div class="hstack" style="padding:9px 0;border-block-end:1px solid var(--border);" data-action="view-visitor" data-id="'+v.id+'" role="button">'+
    '<div style="min-width:0;flex:1;"><div class="cell-name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(v.name)+'</div><div class="cell-sub">'+esc(v.host)+' · '+esc(siteName(v.site))+'</div></div>'+
    '<div style="text-align:end;"><div class="mono" style="font-size:12px;">'+fmtTime(v.checkIn)+'</div><div class="cell-sub">'+esc(v.purpose)+'</div></div>'+
  '</div>';
}
function inviteMini(i){
  return '<div class="hstack" style="padding:9px 0;border-block-end:1px solid var(--border);">'+
    '<div style="min-width:0;flex:1;"><div class="cell-name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(i.visitorName)+'</div><div class="cell-sub">'+esc(i.host)+' · '+esc(siteName(i.site))+'</div></div>'+
    '<div style="text-align:end;"><div class="mono" style="font-size:12px;">'+fmtDateTime(i.scheduled)+'</div>'+
      (i.status==='pending' ? '<button class="btn btn-sm btn-primary" style="margin-top:2px;" data-action="approve-invite" data-id="'+i.id+'">'+t('dash.quickApprove')+'</button>' : statusChip(i.status))+
    '</div>'+
  '</div>';
}

/* ======================================================================
   GENERIC DRAFT BINDING (controlled form state, survives full re-render)
   ====================================================================== */
function getDeep(obj, path){ return path.split('.').reduce((o,k)=> (o==null?o:o[k]), obj); }
function setDeep(obj, path, val){ const parts=path.split('.'); let o=obj; for(let i=0;i<parts.length-1;i++){ if(o[parts[i]]==null) o[parts[i]]={}; o=o[parts[i]]; } o[parts[parts.length-1]]=val; }
function bv(path, fallback){ const v = getDeep(ui.drafts, path); return v==null?(fallback==null?'':fallback):v; }

function defaultCheckinDraft(){
  return { name:'', idType:'Emirates ID', idNumber:'', nationality:'United Arab Emirates', phone:'', phoneCode:'971',
    email:'', company:'', site: state.site!=='all'?state.site:state.sites[0].id, host:'', purpose:'Business Meeting',
    duration:'60', photoTaken:false, signature:'', ack:false, returningQuery:'' };
}
// Best-effort split of a freely-typed stored phone string (e.g. "+971 50 000 0000", legacy
// data from before the country-code dropdown existed on this form) back into a dial code and
// local number, so editing an existing pre-registration pre-fills the same phoneWithCode()
// control the Check-In form uses instead of losing the split. Falls back to +971 (the app's
// default site country) when no known dial code prefix is found.
function splitStoredPhone(raw){
  const s = String(raw||'').trim();
  if(!s) return { code:'971', number:'' };
  if(s.startsWith('+')){
    const digitsOnly = s.slice(1).replace(/\D/g,'');
    const dials = Array.from(new Set(Object.values(PHONE_DIAL_CODES))).sort((a,b)=>b.length-a.length);
    for(const dial of dials){
      if(digitsOnly.startsWith(dial)){
        const rest = s.slice(1).replace(new RegExp('^'+dial+'\\s*'), '').trim();
        return { code: dial, number: rest };
      }
    }
  }
  return { code:'971', number: s };
}
function defaultInviteDraft(inv){
  if(inv){
    const phoneSplit = splitStoredPhone(inv.phone);
    return {
      id: inv.id, name: inv.visitorName || ((inv.firstName||'')+' '+(inv.lastName||'')).trim(), company: inv.company||'',
      email: inv.email||'', phone: phoneSplit.number, phoneCode: inv.phoneCode || phoneSplit.code, idType: inv.idType || (state.idTypes[0]&&state.idTypes[0].name)||'', idNumber: inv.idNumber||'',
      site: inv.site || (state.site!=='all'?state.site:state.sites[0].id),
      visitDate: inv.visitDate || (inv.scheduled ? inv.scheduled.slice(0,10) : ''),
      expectedArrival: inv.expectedArrival || (inv.scheduled ? isoToHHMM(inv.scheduled) : '10:00'),
      expectedDeparture: inv.expectedDeparture || '', duration: inv.duration || '60',
      recurring: inv.recurring || 'none',
      purpose: inv.purpose || (state.purposes[0]&&state.purposes[0].name)||'',
      visitorType: inv.visitorType || 'Regular Visitor',
      host: inv.host || '', department: inv.department || '', meetingRoom: inv.meetingRoom || '',
      numVisitors: inv.numVisitors || 1,
      sendConfirmationEmail: inv.sendConfirmationEmail!==false, notifyHostOnArrival: inv.notifyHostOnArrival!==false,
      sendQrSelfCheckin: inv.sendQrSelfCheckin!==false,
      requiresNda: !!inv.requiresNda, wifiGuestAccess: !!inv.wifiGuestAccess,
      parkingRequired: !!inv.parkingRequired, escortRequired: !!inv.escortRequired,
      specialInstructions: inv.specialInstructions||'', itemsToBring: inv.itemsToBring||'',
    };
  }
  return {
    id:'', name:'', company:'', email:'', phone:'', phoneCode:'971', idType:(state.idTypes[0]&&state.idTypes[0].name)||'', idNumber:'',
    site: state.site!=='all'?state.site:state.sites[0].id,
    visitDate: todayStr(), expectedArrival:'10:00', expectedDeparture:'', duration:'60',
    recurring:'none', purpose: (state.purposes[0]&&state.purposes[0].name)||'', visitorType:'Regular Visitor',
    host:'', department:'', meetingRoom:'', numVisitors:1,
    sendConfirmationEmail:true, notifyHostOnArrival:true, sendQrSelfCheckin:true,
    requiresNda:false, wifiGuestAccess:false, parkingRequired:false, escortRequired:false,
    specialInstructions:'', itemsToBring:'',
  };
}
function buildInviteFromDraft(d, status){
  const hostRec = hostOptionsForMode().find(h=>h.name===d.host);
  const dept = d.department || (hostRec?hostRec.dept:'');
  const visitDate = d.visitDate || todayStr();
  const scheduled = new Date(visitDate+'T'+(d.expectedArrival||'10:00')+':00');
  const { first, last } = splitName(d.name);
  return {
    visitorName: (d.name||'').trim(), firstName:first, lastName:last,
    company:d.company, email:d.email, phone: d.phone ? '+'+(d.phoneCode||'971')+' '+d.phone : '', contact: d.email||(d.phone?'+'+(d.phoneCode||'971')+' '+d.phone:''),
    idType:d.idType, idNumber:d.idNumber, site:d.site,
    visitDate: visitDate, expectedArrival:d.expectedArrival||'10:00', expectedDeparture:d.expectedDeparture,
    duration:d.duration, recurring:d.recurring,
    purpose:d.purpose, visitorType:d.visitorType, host:d.host, hostDept:dept, department:d.department,
    meetingRoom:d.meetingRoom, numVisitors: parseInt(d.numVisitors,10)||1,
    sendConfirmationEmail: !!d.sendConfirmationEmail, notifyHostOnArrival: !!d.notifyHostOnArrival,
    sendQrSelfCheckin: !!d.sendQrSelfCheckin, requiresNda: !!d.requiresNda, wifiGuestAccess: !!d.wifiGuestAccess,
    parkingRequired: !!d.parkingRequired, escortRequired: !!d.escortRequired,
    specialInstructions: d.specialInstructions, itemsToBring: d.itemsToBring,
    scheduled: scheduled.toISOString(), status,
  };
}
function defaultBlacklistDraft(){ return { name:'', idNumber:'', nationality:'', reason:'', severity:'serious' }; }
function defaultSiteDraft(s){

function expectedRowsToday(){
  return bySite(state.invites)
    .filter(i => ['pending','approved'].includes(i.status) && isSameDay(new Date(i.scheduled), new Date()))
    .map(i => ({
      id:'INV-'+i.id, isInvite:true, inviteId:i.id, name:i.visitorName, idType:i.idType||'', idNumber:i.contact||'',
      nationality:'', phone:i.contact||'', company:'—', host:i.host||'—', hostDept:i.hostDept||'',

// KPI counts for the Visitor Log's stat cards. Mirrors filteredVisitors()'s own range/site/purpose
// filtering (but not its status pill or search text) so the four numbers stay meaningful together
// regardless of which status pill happens to be active — same relationship "Total Upcoming" /
// "Confirmed" / "Pending" / "Today's Expected" have to each other on the Pre-Registration page.
// Shared by visitorStats() and filteredVisitors() so the "range" filter's five modes (today /
// last 7 / last 30 / all time / a picked from–to span) only need to be taught once. 'custom'
// compares against the full checkIn timestamp, so an empty From/To side leaves that end open
// (e.g. From alone means "from that date onward") and a To date includes the whole of that day.
function applyVisitorRangeFilter(list, f){
  if(f.range==='today') return list.filter(v=>isSameDay(new Date(v.checkIn), new Date()));
  if(f.range==='7d') return list.filter(v=> daysDiff(new Date(), new Date(v.checkIn)) <= 6);
  if(f.range==='30d') return list.filter(v=> daysDiff(new Date(), new Date(v.checkIn)) <= 29);
  if(f.range==='custom'){
    if(f.customFrom) list = list.filter(v=> new Date(v.checkIn) >= new Date(f.customFrom+'T00:00:00'));
    if(f.customTo) list = list.filter(v=> new Date(v.checkIn) <= new Date(f.customTo+'T23:59:59'));
  }

}

  if(f.purpose && f.purpose!=='all') base = base.filter(v=>v.purpose===f.purpose);

  // on this page they're never subject to the "range" filter (which is really about check-in

  let expected = expectedRowsToday();

/* ======================================================================
   FORM VALIDATION HELPERS
   ====================================================================== */
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const MIN_NAME_LEN = 2;
function isValidEmail(v){ return EMAIL_RE.test((v||'').trim()); }
// Accepts digits, spaces, dashes, parens and an optional leading "+"; requires 7-15 digits
// overall (loosely matches the E.164 range) so it works for any country's format without
// forcing a specific one.
function isValidPhone(v){
  const s = (v||'').trim();
  if(!s) return false;
  if(!/^\+?[0-9 \-()]+$/.test(s)) return false;
  const digits = s.replace(/[^0-9]/g,'');
  return digits.length>=7 && digits.length<=15;
}
function isMinLen(v, n){ return (v||'').trim().length >= (n||MIN_NAME_LEN); }
// Looks up an error bag by namespace (e.g. 'employee') — populated only after a failed submit
// attempt for that form, so a freshly-opened form never nags before the user has typed anything.
function clearFormErr(ns){ ui.formErrors[ns] = {}; }
function input(type, bind, value, extra){
  extra = extra||{};
  return '<input type="'+type+'" id="'+(extra.id||('fld-'+bind))+'" data-bind="checkin.'+bind+'" value="'+esc(value)+'">';
}
function select(bind, options, value, group){
  const g = group||'checkin';
  const path = g+'.'+bind;
  return fauxSelect(path, options, value, {kind:'bind', path});
}
// Like select(), but for fields that live straight on `state` and save immediately (no
// draft/Save-button flow) — e.g. the Badges page's live settings. `bind` is a dotted path
// under state, such as 'badgeTheme.style'.
function stateSelect(bind, options, value){
  const path = 'state.'+bind;
  return fauxSelect(path, options, value, {kind:'bind', path});
}
// 15-minute-granularity 24-hour "HH:MM" values for the time picker below. Raw values only —
// no t()/fmtTimeStr() call here — because this is a top-level const evaluated at script-parse
// time, before state.lang exists (see the fauxSelect option lists further down for the same
// pattern). Labels are localized lazily, per render, in timeSelect() itself.
const TIME_OPTIONS_VALUES = (function(){
  const out = [];
  for(let h=0; h<24; h++){ for(let m=0; m<60; m+=15){ out.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')); } }
  return out;
})();
// A fauxSelect-styled time picker — searchable dropdown list, matches every other combo in the
// app — used in place of the native <input type="time">, whose browser-drawn hour/minute/AM-PM
// scroller looks inconsistent with the rest of the UI. Pass emptyLabel to prepend a blank ""
// option (for optional time fields like an expected-departure time).
function timeSelect(bind, value, group, emptyLabel){
  const g = group||'checkin';
  const path = g+'.'+bind;
  const options = TIME_OPTIONS_VALUES.map(v=>[v, fmtTimeStr(v)]);
  return fauxSelect(path, emptyLabel ? [['', emptyLabel]].concat(options) : options, value, {kind:'bind', path});
}
// Phone number field with an attached country-code select (flag + dial code), defaulting
// to +971 (UAE) via defaultCheckinDraft(). codeBind and numberBind are both plain
// data-bind paths under the given group, so they save/restore the same way every other
// checkin field does — no special-case wiring needed in the submit handler beyond joining
// the two back together.
function phoneWithCode(numberBind, codeBind, numberValue, codeValue, group){
  const g = group||'checkin';
  const codePath = g+'.'+codeBind;
  const codeOptions = PHONE_COUNTRY_LIST.map(c=>[c.dial, (emojiFlagsSupported()?flagEmoji(c.code)+' ':'')+'+'+c.dial]);
  return '<div class="phone-group">'+
    fauxSelect(codePath, codeOptions, codeValue, {kind:'bind', path:codePath, cls:'phone-code-select'})+
    '<input type="tel" data-bind="'+g+'.'+numberBind+'" value="'+esc(numberValue)+'" placeholder="'+esc(t('checkin.phonePh'))+'">'+
  '</div>';
}
function nationalityCombo(value){
  const nat = ui.checkinNat;
  const selected = COUNTRY_LIST.find(c=>c.name===value);
  const open = !!nat.open;
  const displayValue = open ? (nat.query||'') : (selected ? selected.name : (value||''));
  const q = (open ? (nat.query||'') : '').trim().toLowerCase();
  const list = open ? (q ? COUNTRY_LIST.filter(c=>c.name.toLowerCase().includes(q)) : COUNTRY_LIST) : [];
  const flagsOk = emojiFlagsSupported();
  return '<div class="combo-wrap'+(selected&&!open&&flagsOk?' has-flag':'')+'" data-combo="nationality">'+
    (selected && !open && flagsOk ? '<span class="combo-flag-prefix">'+flagEmoji(selected.code)+'</span>' : '')+
    '<input type="text" autocomplete="off" class="combo-input" id="ci-nationality-input" data-action="open-nationality-combo" placeholder="'+esc(t('checkin.nationalitySearchPh'))+'" value="'+esc(displayValue)+'">'+
    (open ? '<div class="combo-dropdown">'+
      (list.length ? list.slice(0,300).map(c=>'<div class="combo-option'+(selected&&c.name===selected.name?' selected':'')+'" data-action="select-nationality" data-id="'+esc(c.name)+'">'+flagSpan(c.code)+'<span class="combo-main"><span>'+esc(c.name)+'</span></span>'+(selected&&c.name===selected.name?icon('check','combo-check'):'')+'</div>').join('')
        : '<div class="combo-empty">'+t('checkin.noCountryMatch')+'</div>')+
    '</div>' : '')+
  '</div>';
}
// Searchable host/employee combo. Shared by the Check-In form and the Pre-Registration
// (invite) form via `key` ('checkin' default, or 'invite') — each keeps its own transient
// open/query state (ui.checkinHost / ui.inviteHost) and its own input id, so the two forms
// never interfere with each other even when both could theoretically be mid-search at once.
// One config entry per place hostCombo() is used — checkin/invite (Employees & Tower modes)
// plus gatepass (Tower-only Gate Pass form). Adding a new combo just means adding an entry
// here plus a matching one in CHECKIN_COMBOS (for its live keystroke filter) rather than
// threading a new key through three separate if/else chains.
const HOST_COMBO_CONFIG = {
  checkin:  { state: ()=>ui.checkinHost,  inputId:'ci-host-input',       comboAttr:'host',         bindPath:'checkin.host' },
  invite:   { state: ()=>ui.inviteHost,   inputId:'invite-host-input',   comboAttr:'invite-host',  bindPath:'invite.host' },
  gatepass: { state: ()=>ui.gatepassHost, inputId:'gatepass-host-input', comboAttr:'gatepass-host', bindPath:'gatePass.host' },
};
function hostCombo(value, key, siteId){
  const k = key||'checkin';
  const cfg = HOST_COMBO_CONFIG[k] || HOST_COMBO_CONFIG.checkin;
  const st = cfg.state();
  const options = hostOptionsForMode(siteId);
  const selected = options.find(h=>h.name===value);
  const open = !!st.open;
  const displayValue = open ? (st.query||'') : (selected ? (selected.name+' · '+selected.dept) : (value||''));
  const q = (open ? (st.query||'') : '').trim().toLowerCase();
  // Matches office/employee name, floor/department (dept), and — in Tower mode — the

  const list = open ? (q ? options.filter(h=>h.name.toLowerCase().includes(q) || h.dept.toLowerCase().includes(q) || (h.tenant||'').toLowerCase().includes(q)) : options) : [];

// Generic styled-dropdown replacement for a plain <select> — same visual language and
// search-box interaction as hostCombo/nationalityCombo above (a .combo-wrap input that
// opens a .combo-dropdown list), but fully generic instead of being wired to one specific
// field. Only one fauxSelect can be open at a time (ui.openFauxselect holds its `id`), which
// is fine since a native select can likewise only have one options list open at once.
//   id     — a string unique to this field (its bind/filter path already is, so callers
//            just reuse that rather than inventing a separate id).
//   options — array of [value, label] pairs, exactly like the select() helper already took.
//   value   — the field's current value.
//   cfg.kind — how a pick gets applied once the dispatch handler receives it:
//     'bind'   (default) — cfg.path is a "group.field" path applied the same way a plain
//               data-bind select already was: ui.drafts.<path>, or state.<path> when the
//               path starts with "state.".
//     'filter' — cfg.view + cfg.field, applied like the table filter bar selects
//               (ui[view][field] = value, resetting ui[view].page when present).
//     'site'   — the one-off topbar global site selector (state.site + saveState()).
function fauxSelect(id, options, value, cfg){
  cfg = cfg||{};
  const open = ui.openFauxselect === id;
  const selected = options.find(o=>o[0]==value);
  const selectedLabel = selected ? selected[1] : '';
  const q = open ? (ui.fauxselectQuery||'') : '';
  const ql = q.trim().toLowerCase();
  const list = (open && ql) ? options.filter(o=>String(o[1]).toLowerCase().includes(ql)) : options;
  const displayValue = open ? q : selectedLabel;
  return '<div class="combo-wrap fauxselect'+(cfg.cls?' '+cfg.cls:'')+'" data-fauxselect="'+esc(id)+'" data-fs-kind="'+esc(cfg.kind||'bind')+'" data-fs-path="'+esc(cfg.path||'')+'" data-fs-view="'+esc(cfg.view||'')+'" data-fs-field="'+esc(cfg.field||'')+'">'+
    '<input type="text" autocomplete="off" class="combo-input" data-fs-input="'+esc(id)+'" data-action="open-fauxselect" placeholder="'+esc(selectedLabel)+'" value="'+esc(displayValue)+'">'+
    (open ? '<div class="combo-dropdown">'+
      (list.length ? list.slice(0,400).map(o=>'<div class="combo-option'+(o[0]==value?' selected':'')+'" data-action="select-fauxselect" data-value="'+esc(o[0])+'"><span class="combo-main"><span>'+esc(o[1])+'</span></span>'+(o[0]==value?icon('check','combo-check'):'')+'</div>').join('')
        : '<div class="combo-empty">'+t('common.noMatches')+'</div>')+
    '</div>' : '')+
  '</div>';
}
// fauxSelect() wired the way a filter-bar <select> was (see handleFilterChange): writes
// straight to ui[view][field] and resets that view's page, instead of a data-bind path.
function filterSelect(view, field, options, value, cls){
  return fauxSelect('filter:'+view+'.'+field, options, value, {kind:'filter', view, field, cls});
}

/* ======================================================================
   CUSTOM DATE PICKER — a styled calendar dropdown replacing the browser's native
   <input type="date"> popup everywhere the app collects a single date, so every date field
   looks and behaves like the rest of the app's dropdowns (fauxSelect) instead of whichever
   calendar the visitor's OS/browser happens to draw. Underlying value stays a plain
   'YYYY-MM-DD' string, so every existing data-bind / data-filter-* consumer is unaffected.
   ====================================================================== */
function pad2(n){ return String(n).padStart(2,'0'); }
function parseIsoDate(s){
  if(!s) return null;
  const parts = String(s).split('-');
  if(parts.length!==3) return null;
  const y = +parts[0], m = +parts[1]-1, d = +parts[2];
  if(isNaN(y)||isNaN(m)||isNaN(d)) return null;
  return { y, m, d };
}
function dayOfWeekLabels(){
  const labels = [];
  const base = new Date(2023,0,1); // a Sunday, so index 0..6 lines up with Date#getDay()
  const isAr = state.lang==='ar';
  for(let i=0;i<7;i++){
    const d = new Date(base.getFullYear(), base.getMonth(), base.getDate()+i);
    // Arabic has no distinct abbreviated weekday form in ICU data — 'short' returns the full
    // name (e.g. "الأحد"), so slicing it produces meaningless fragments (like the definite
    // article alone). 'narrow' gives the standard single-letter Arabic weekday initial instead.
    // English keeps 'short' sliced to 2 letters (Su, Mo, Tu…), matching the familiar calendar look.
    labels.push(isAr ? d.toLocaleDateString('ar-AE', {weekday:'narrow'}) : d.toLocaleDateString('en-AE', {weekday:'short'}).slice(0,2));
  }
  return labels;
}
function buildCalendarCells(year, month){
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const prevY = month===0 ? year-1 : year, prevM = month===0 ? 11 : month-1;
  const nextY = month===11 ? year+1 : year, nextM = month===11 ? 0 : month+1;
  const cells = [];
  for(let i=0;i<startDow;i++){ cells.push({ y:prevY, m:prevM, d: daysInPrevMonth-startDow+1+i, outside:true }); }
  for(let d=1; d<=daysInMonth; d++){ cells.push({ y:year, m:month, d, outside:false }); }
  const total = Math.ceil(cells.length/7)*7;
  let nd = 1;
  while(cells.length < total){ cells.push({ y:nextY, m:nextM, d:nd, outside:true }); nd++; }
  return cells;
}
// Renders the month-name grid (12 cells for `year`) shown when the header's month name is
// clicked — a fast way to jump to any month without stepping through datepicker-nav one month

// Renders a 12-year block (aligned to a fixed 0..11-mod-12 grid, like a decade view) shown when
// the header's year is clicked. Picking one returns to the day grid (same month, new year).
function datePickerYearGridHtml(year){
  const today = new Date();

      '<button type="button" class="dp-nav-btn" data-action="datepicker-nav" data-dir="-1" title="'+esc(t('common.prevYears'))+'">'+icon('chevronDown','dp-nav-ic dp-nav-prev')+'</button>'+
      // dir="ltr" keeps the two numbers in "2016–2027" reading left-to-right even inside an

      '<span class="dp-month-label" dir="ltr">'+blockStart+'–'+(blockStart+11)+'</span>'+

function datePickerPanelHtml(year, month, value){
  // The month-name and year in the day grid's header (and the corresponding controls in the

    '</div>'+
    '<div class="dp-grid">'+
      dayOfWeekLabels().map(function(dw){ return '<div class="dp-dow">'+esc(dw)+'</div>'; }).join('')+
      cells.map(function(c){
        const iso = c.y+'-'+pad2(c.m+1)+'-'+pad2(c.d);
        const cls = ['dp-day'];
        if(c.outside) cls.push('outside');

        if(value && iso===value) cls.push('selected');
        return '<button type="button" class="'+cls.join(' ')+'" data-action="pick-datepicker-day" data-date="'+iso+'">'+c.d+'</button>';
      }).join('')+

    '<div class="dp-foot">'+
      '<button type="button" data-action="clear-datepicker">'+esc(t('common.clear'))+'</button>'+
      '<button type="button" data-action="datepicker-today">'+esc(t('common.today'))+'</button>'+
    '</div>'+
  '</div>';
}
// bindPath: a data-bind style path ('invite.visitDate', or 'state.…' to write straight to
// state and save) for kind:'bind'; for kind:'filter' pass {view,field} instead — mirrors
// fauxSelect()'s own kind split so the click dispatch can reuse the same read/write rules.
function datePicker(id, kind, meta, value){
  const open = ui.openDatepicker === id;
  const parsed = parseIsoDate(value);
  const today = new Date();
  const nav = (open && ui.datepickerNav) ? ui.datepickerNav : { y: parsed?parsed.y:today.getFullYear(), m: parsed?parsed.m:today.getMonth() };
  const displayValue = value ? fmtDate(value+'T00:00:00') : '';
  const kindAttrs = kind==='filter'
    ? ' data-dp-kind="filter" data-dp-view="'+esc(meta.view)+'" data-dp-field="'+esc(meta.field)+'"'
    : ' data-dp-kind="bind" data-dp-path="'+esc(meta.path)+'"';
  return '<div class="combo-wrap dp-wrap" data-datepicker="'+esc(id)+'" data-dp-value="'+esc(value||'')+'"'+kindAttrs+'>'+
    '<input type="text" readonly autocomplete="off" class="combo-input dp-input" data-dp-input="'+esc(id)+'" data-action="open-datepicker" placeholder="'+esc(t('common.selectDate'))+'" value="'+esc(displayValue)+'">'+
    icon('calendar','dp-icon')+
    (open ? datePickerPanelHtml(nav.y, nav.m, value) : '')+
  '</div>';
}
function bindDatePicker(bind, value, group){
  const g = group||'checkin';
  const path = g+'.'+bind;
  return datePicker(path, 'bind', {path}, value);
}
function filterDatePicker(view, field, value){
  return datePicker('filter:'+view+'.'+field, 'filter', {view, field}, value);
}

function hashStr(s){ let h=0; for(let i=0;i<(s||'').length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }
function purposePill(name){
  const v = 's'+((hashStr(name)%8)+1);
  return '<span class="chip" style="background:color-mix(in srgb, var(--'+v+') 16%, transparent); color:var(--'+v+');">'+esc(name||'—')+'</span>';
}
function inviteDateBucket(inv, now){
  const diff = daysDiff(new Date(inv.scheduled), now);
  if(diff===0) return 'today';
  if(diff>0) return 'upcoming';
  return 'past';
}
function invitesForTab(pool, tab, customFrom, customTo){
  if(tab==='all') return pool;
  if(tab==='custom'){
    let list = pool;
    if(customFrom) list = list.filter(i=> new Date(i.scheduled) >= new Date(customFrom+'T00:00:00'));
    if(customTo) list = list.filter(i=> new Date(i.scheduled) <= new Date(customTo+'T23:59:59'));
    return list;
  }
  const now = new Date();
  return pool.filter(i=>inviteDateBucket(i, now)===tab);
}
function inviteStats(pool){
  const now = new Date();
  const upcoming = pool.filter(i=> daysDiff(new Date(i.scheduled), now) >= 0 && !['cancelled','draft'].includes(i.status));
  const todayExpected = pool.filter(i=> daysDiff(new Date(i.scheduled), now)===0 && !['cancelled','draft'].includes(i.status)).length;
  return {
    totalUpcoming: upcoming.length,
    confirmed: upcoming.filter(i=>i.status==='approved').length,
    pending: upcoming.filter(i=>i.status==='pending').length,
    todayExpected,
  };
}

/* ------------------------------------------------------------------------

   Microsoft Graph subscription (there's no live network/OAuth in this demo
   file). state.calendarEvents holds mock "pulled from Outlook" meetings that

function calendarSyncConfig(){
  const integ = state.integrations.find(x=>(x.id==='outlookCalendar'||x.id==='calendar') && x.status==='connected');
  return integ ? (integ.config || defaultCalendarConfig()) : null;
}
function calendarSyncEvents(){
  const cfg = calendarSyncConfig();
  if(!cfg || cfg.autoCreatePrereg===false) return null;

  return (state.calendarEvents||[])
    .filter(e=> !e.imported && new Date(e.start).getTime() <= horizon)

VIEW_RENDERERS.invites = function(){

  const tab = ui.invites.tab;

  const sf = ui.invites.statusFilter;
  const counts = { all: list.length, approved: list.filter(i=>i.status==='approved').length, pending: list.filter(i=>i.status==='pending').length, cancelled: list.filter(i=>i.status==='cancelled').length };
  if(sf==='approved') list = list.filter(i=>i.status==='approved');
  else if(sf==='pending') list = list.filter(i=>i.status==='pending');

/* ------------------------------------------------------------------------
   MEETING ROOM BOOKING — a room "booking" is just any active (non-cancelled)
   pre-registration that has that room selected for a given date/time, so the
   schedule below is computed straight from state.invites rather than kept as
   a separate, driftable list.
   ------------------------------------------------------------------------ */
function timeToMinutes(hhmm){
  if(!hhmm) return 0;
  const parts = hhmm.split(':');
  return (parseInt(parts[0],10)||0)*60 + (parseInt(parts[1],10)||0);
}
function inviteTimeRange(inv){
  const start = timeToMinutes(inv.expectedArrival||'09:00');
  return { start, end: start + (parseInt(inv.duration,10)||60) };
}
// Every active booking for `roomName` on `date`, sorted by start time. `excludeInviteId` leaves
// out the invite currently being edited, so editing a booking doesn't conflict with itself.
function roomBookingsOn(roomName, date, excludeInviteId){
  if(!roomName || roomName==='No preference') return [];
  return state.invites
    .filter(i=> i.meetingRoom===roomName && i.visitDate===date && i.status!=='cancelled' && i.id!==excludeInviteId)
    .sort((a,b)=> timeToMinutes(a.expectedArrival) - timeToMinutes(b.expectedArrival));
}
function roomConflictsFor(roomName, date, arrival, durationMin, excludeInviteId){
  if(!roomName || roomName==='No preference' || !date) return [];
  const start = timeToMinutes(arrival||'09:00');
  const end = start + (parseInt(durationMin,10)||60);
  return roomBookingsOn(roomName, date, excludeInviteId).filter(i=>{
    const r = inviteTimeRange(i);
    return r.start < end && start < r.end;
  });
}

/* ======================================================================
   DELIVERIES — a distinct module from a plain "Delivery / Courier" visitor purpose: a
   package is logged against a recipient employee, tracked as awaiting-pickup vs collected,
   and flagged once it's sat unclaimed past DELIVERY_UNCLAIMED_DAYS.
   ====================================================================== */
function deliveryAgeDays(d){ return daysDiff(new Date(), new Date(d.receivedAt)); }
function deliveryIsUnclaimed(d){ return d.status==='awaiting-pickup' && deliveryAgeDays(d) >= DELIVERY_UNCLAIMED_DAYS; }
function filteredDeliveries(){
  let list = (state.deliveries||[]).slice();
  // Deliveries are logged two different ways depending on business mode — Employee mode's
  // manual "Log Delivery" form always resolves a real employee recipient (recipientEmployeeId
  // set); Tower mode's only path is redeeming a delivery Gate Pass (see redeem-gatepass), which
  // has no employee to link — recipientEmployeeId is left '' and recipientName is just the
  // office/unit name from the pass. That's already a reliable, pre-existing signal for which
  // mode a given package was logged under, so filter on it here (the single place every
  // Deliveries-page view — stats, pills, table, CSV export — reads from) rather than showing
  // both modes' packages mixed together.
  list = list.filter(d => isTowerMode() ? !d.recipientEmployeeId : !!d.recipientEmployeeId);
  const branch = ui.deliveries.branchFilter;
  if(branch && branch!=='all') list = list.filter(d=>d.site===branch);
  const q = (ui.deliveries.search||'').trim().toLowerCase();
  if(q){
    list = list.filter(d=>
      (d.description||'').toLowerCase().includes(q) ||
      (d.carrier||'').toLowerCase().includes(q) ||
      (d.trackingNumber||'').toLowerCase().includes(q) ||
      (d.recipientName||'').toLowerCase().includes(q));
  }
  return list;
}

  const collectedToday = all.filter(d=>d.status==='collected' && d.collectedAt && isSameDay(new Date(d.collectedAt), now)).length;

  '</div>';

        return '<button type="button" class="statuspill'+(sf===k?' active':'')+'" style="--pill-color:'+color+';" data-action="set-deliveries-status-pill" data-status="'+k+'">'+label+' <b class="tabular">'+counts[k]+'</b></button>';
      }).join('')+

      '<button class="btn" data-action="export-deliveries">'+icon('download')+t('deliveries.export')+'</button>'+
