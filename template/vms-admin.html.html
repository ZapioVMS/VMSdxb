document.addEventListener('input', function(e){
  const el = e.target;
  if(!el.getAttribute) return;
  // The login screen's email/password/code inputs (see renderAuthRoot()) deliberately opt out
  // of the render-on-every-keystroke pattern every other data-bind field uses. That pattern
  // destroys and recreates the focused input on every single keystroke, then re-focuses the new
  // node — fine for occasional edits, but a field someone types into quickly and continuously (an
  // email address, a password, and especially a 6-digit code) can't always keep up, dropping
  // focus and forcing a re-click after nearly every character. Keep ui.drafts.auth in sync for
  // whenever a render does happen anyway (submit, a demo-account chip, switching language/theme)
  // without triggering one here.
  if(AUTH_FAST_INPUT_IDS.includes(el.id)){ setDeep(ui.drafts, el.getAttribute('data-bind'), el.value); return; }
  // Crop modal sliders (zoom/pan-x/pan-y): same reasoning as the color picker below — dragging
  // a <input type="range"> fires 'input' continuously, and rebuilding the whole modal via
  // render() on every tick would fight the browser's own drag handling. Update the crop state
  // and nudge the preview image's style directly instead, skipping render() entirely.
  if(el.id==='cropZoom' || el.id==='cropPanX' || el.id==='cropPanY'){
    if(!ui.crop) return;
    if(el.id==='cropZoom') ui.crop.zoom = parseFloat(el.value) || 1;
    if(el.id==='cropPanX') ui.crop.panX = parseFloat(el.value) || 0;
    if(el.id==='cropPanY') ui.crop.panY = parseFloat(el.value) || 0;
    const cropImg = document.getElementById('cropImg');
    if(cropImg){
      cropImg.style.objectPosition = ui.crop.panX+'% '+ui.crop.panY+'%';
      cropImg.style.transformOrigin = ui.crop.panX+'% '+ui.crop.panY+'%';
      cropImg.style.transform = 'scale('+ui.crop.zoom+')';
    }
    return;
  }
  if(el.tagName==='SELECT' && el.multiple) return; // multi-selects are handled on 'change' only, see below
  // Native color pickers (<input type="color">) fire 'input' continuously while the OS
  // picker is open/being dragged; re-rendering on every one of those events destroys and
  // recreates the input mid-interaction, which closes the picker after a single drag. Only
  // react on 'change' (fired once, when the picker is confirmed/closed) for these — see the
  // 'change' listener below.
  if(el.tagName==='INPUT' && el.type==='color') return;
  const combo = CHECKIN_COMBOS[el.id];
  if(combo){ const st = combo.state(); st.query = el.value; st.open = true; render(); return; }
  if(el.hasAttribute('data-fs-input')){
    ui.openFauxselect = el.getAttribute('data-fs-input');
    ui.fauxselectQuery = el.value;
    render();
    return;
  }
  if(el.hasAttribute('data-bind')) { handleBindChange(el); return; }
  if(el.hasAttribute('data-filter-view')) { handleFilterChange(el); return; }
  if(el.id==='globalSearchInput'){
    ui.globalSearch = el.value;
    // Already on a page with its own list search — filter live, same as that page's own
    // search box, instead of requiring Enter (which is easy to miss and is why this looked
    // non-functional).
    if(GLOBAL_SEARCH_VIEWS.includes(ui.view)){
      ui[ui.view].search = el.value;
      if('page' in ui[ui.view]) ui[ui.view].page = 1;
      render();
    }
    return;
  }
});
// Signature pad drawing — delegated pointer events (covers mouse, touch and stylus in one code
// path) on #sigPadCanvas. Deliberately mirrors the crop modal's slider handling above: drawing
// happens straight on the canvas's own 2D context and never calls render(), since rebuilding the
// modal's innerHTML mid-stroke would wipe the in-progress line and fight the browser's own
// pointer handling. ui.sigPad.drawing/lastX/lastY track the in-progress stroke; nothing here is
// persisted into ui.drafts until "Save Signature" (see saveSignaturePad()) rasterizes the canvas.
function sigPadPoint(canvas, e){
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
  return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}
document.addEventListener('pointerdown', function(e){
  if(e.target && e.target.id==='sigPadCanvas' && ui.sigPad){
    const canvas = e.target;
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    const p = sigPadPoint(canvas, e);
    ui.sigPad.drawing = true; ui.sigPad.lastX = p.x; ui.sigPad.lastY = p.y;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#1a2b3c'; ctx.beginPath(); ctx.arc(p.x, p.y, 1.4, 0, Math.PI*2); ctx.fill();
    ui.sigPad.empty = false;
    e.preventDefault();
  }
});
document.addEventListener('pointermove', function(e){
  if(e.target && e.target.id==='sigPadCanvas' && ui.sigPad && ui.sigPad.drawing){
    const canvas = e.target;
    const p = sigPadPoint(canvas, e);
    const ctx = canvas.getContext('2d');
    ctx.strokeStyle = '#1a2b3c'; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(ui.sigPad.lastX, ui.sigPad.lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
    ui.sigPad.lastX = p.x; ui.sigPad.lastY = p.y;
    e.preventDefault();
  }
});
['pointerup','pointercancel','pointerleave'].forEach(evt=>{
  document.addEventListener(evt, function(e){
    if(ui.sigPad && ui.sigPad.drawing) ui.sigPad.drawing = false;
  });
});
// Closes a search-combo dropdown when a click lands outside it — this listener runs on
// every click (not gated on data-action) since "click somewhere else entirely" (another
// form field, blank space) has no data-action of its own to hook into.
document.addEventListener('click', function(e){
  let changed = false;
  Object.values(CHECKIN_COMBOS).forEach(combo=>{
    const st = combo.state();
    if(st.open && !e.target.closest(combo.wrap)){ st.open = false; st.query = ''; changed = true; }
  });
  if(ui.openFauxselect){
    const openWrap = e.target.closest('[data-fauxselect]');
    if(!openWrap || openWrap.getAttribute('data-fauxselect')!==ui.openFauxselect){ ui.openFauxselect = ''; ui.fauxselectQuery = ''; changed = true; }
  }
  if(ui.openDatepicker){
    const openDp = e.target.closest('[data-datepicker]');
    if(!openDp || openDp.getAttribute('data-datepicker')!==ui.openDatepicker){ ui.openDatepicker = ''; ui.datepickerNav = null; changed = true; }
  }
  if(ui.quickActions.open && !e.target.closest('.qa-wrap')){ ui.quickActions.open = false; changed = true; }
  if(ui.agreements.menuOpenId && !e.target.closest('.tpl-menu-wrap')){ ui.agreements.menuOpenId = ''; changed = true; }
  if(ui.users.menuOpenId && !e.target.closest('.tpl-menu-wrap')){ ui.users.menuOpenId = ''; changed = true; }
  if(changed) render();
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape' && ui.openFauxselect){ ui.openFauxselect = ''; ui.fauxselectQuery = ''; render(); }
  if(e.key==='Escape' && ui.openDatepicker){ ui.openDatepicker = ''; ui.datepickerNav = null; render(); }
  if(e.key==='Escape' && ui.modal){ closeModal(); }
  if(e.key==='Escape' && ui.quickActions.open){ ui.quickActions.open = false; render(); }
  if(e.key==='Enter' && e.target && e.target.id==='qa-badge-input'){ e.preventDefault(); quickScanLookup(); }
  const combo = e.target && CHECKIN_COMBOS[e.target.id];
  if(combo){
    const st = combo.state();
    if(e.key==='Escape'){ st.open = false; st.query = ''; render(); }
    else if(e.key==='Enter'){
      e.preventDefault();
      const q = (st.query||'').trim().toLowerCase();
      const list = combo.matches(q);
      if(list.length===1 || (list.length>1 && q)){
        setDeep(ui.drafts, combo.path, combo.valueOf(list[0]));
        st.open = false; st.query = '';
        render();
      }
    }
  }
  if(e.key==='Enter' && e.target && e.target.hasAttribute && e.target.hasAttribute('data-fs-input') && ui.openFauxselect){
    e.preventDefault();
    const wrap = e.target.closest('[data-fauxselect]');
    const opt = wrap ? wrap.querySelector('.combo-option') : null;
    if(opt) opt.click();
  }
  if(e.key==='Enter' && e.target && e.target.id==='globalSearchInput'){
    e.preventDefault();
    // On a page with its own list search, typing already filters it live (see the input
    // handler above) — Enter has nothing left to do. Everywhere else, jump to Visitor Log
    // with the typed term applied, same as before.
    if(!GLOBAL_SEARCH_VIEWS.includes(ui.view)){
      ui.visitors.search = ui.globalSearch; ui.visitors.page = 1;
      go('visitors');
    }
  }
  if(e.key==='Enter' && e.target && e.target.id==='kioskScanInput'){
    e.preventDefault();
    processKioskScan(e.target.value);
  }
  if(e.key==='Enter' && e.target && e.target.id==='purposeOptionsNewInput'){
    e.preventDefault();
    document.querySelector('[data-action="add-purpose-option-chip"]')?.click();
  }
});

/* ======================================================================
   INIT
   ====================================================================== */
render();
</script>
